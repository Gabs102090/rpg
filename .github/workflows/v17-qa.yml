name: V17 QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check all V17 JavaScript
        run: |
          for f in v17.js v17-ui.js v17-cooldown.js v17-skilltree.js v17-launcher.js sw.js; do
            node --check "$f"
          done
      - name: Run V17 smoke tests
        run: node qa/v17-smoke-test.mjs
