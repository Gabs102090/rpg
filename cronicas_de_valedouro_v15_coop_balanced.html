const finite=(v,f)=>Number.isFinite(Number(v))?Number(v):f; function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a} function log(t){s.log=s.log||[];s.log.push(t);s.log=s.log.slice(-80)} function skillLevel(k){let n=s.skills[k]||0;if(s.companion&&companions.some(c=>c.name===s.companion&&c.type===k))n++;return n} function canReq(r){return !r||skillLevel(r.skill)>=r.level} function reqText(r){return r?`🔒 Requer ${SKILL_INFO[r.skill]?.name||r.skill} ${r.level}`:'Disponível'} function pct(a,b){return b?Math.max(0,Math.min(100,a/b*100)):0}
function sanitize(x){const d=defaults(),z=x&&typeof x==='object'?x:{};for(const k of ['level','xp','xpNext','hp','maxHp','energy','maxEnergy','gold','day','gameMinutes'])z[k]=finite(z[k],d[k]);z.level=Math.max(1,Math.floor(z.level));z.xp=Math.max(0,z.xp);z.xpNext=Math.max(100,z.xpNext);z.maxHp=Math.max(1,z.maxHp);z.hp=Math.max(0,Math.min(z.maxHp,z.hp));z.maxEnergy=Math.max(1,z.maxEnergy);z.energy=Math.max(0,Math.min(z.maxEnergy,z.energy));z.gold=Math.max(0,Math.floor(z.gold));z.day=Math.max(1,Math.floor(z.day));z.gameMinutes=Math.max(0,Math.floor(z.gameMinutes));z.name=String(z.name||'Aventureiro').slice(0,20);z.mode=['easy','medium','hard','hardcore'].includes(z.mode)?z.mode:'medium';z.currentTab=['explore','inventory','craft','skills','town','farm','pets'].includes(z.currentTab)?z.currentTab:'explore';z.events=Array.isArray(z.events)?z.events.slice(0,8):[];z.lastRealMs=finite(z.lastRealMs,Date.now());z.zone=zones.some(a=>a.name===z.zone)?z.zone:d.zone;z.skills=Object.assign({},d.skills,z.skills||{});z.inv=Object.assign({},d.inv,z.inv||{});z.equip=Object.assign({},d.equip,z.equip||{});z.farming=Object.assign({},d.farming,z.farming||{});z.farming.slots=6;z.farming.crops=Array.isArray(z.farming.crops)?z.farming.crops.filter(c=>c&&PLANTS[c.type]&&Number.isFinite(Number(c.readyAt))):[];z.effects=Object.assign({},z.effects||{});for(const k in z.effects){if(k!=='_cleanup'&&(!z.effects[k]||!Number.isFinite(Number(z.effects[k].until))))delete z.effects[k]}z.pets=Object.assign({},d.pets,z.pets||{});for(const pn of Object.keys(d.pets)){z.pets[pn]=Object.assign({},d.pets[pn],z.pets[pn]||{});z.pets[pn].level=Math.max(1,Math.floor(finite(z.pets[pn].level,1)));z.pets[pn].xp=Math.max(0,finite(z.pets[pn].xp,0))}z.petActive=z.petActive&&d.pets[z.petActive]?z.petActive:null;z.reputation=Object.assign({},d.reputation,z.reputation||{});z.achievements=Object.assign({},z.achievements||{});z.stats=Object.assign({},d.stats,z.stats||{});z.flags=Object.assign({},d.flags,z.flags||{});z.quests=Array.isArray(z.quests)?z.quests:d.quests;z.lastEvent=z.lastEvent&&typeof z.lastEvent==='object'?z.lastEvent:null;z.activeCraft=z.activeCraft&&recipes[z.activeCraft.key]&&Number.isFinite(Number(z.activeCraft.endAt))?z.activeCraft:null;for(const k of Object.keys(d.skills))z.skills[k]=Math.max(0,Math.floor(finite(z.skills[k],0)));for(const k of Object.keys(d.inv))z.inv[k]=Math.max(0,Math.floor(finite(z.inv[k],d.inv[k])));for(const k of ['Arven','Maré','Sombra'])z.reputation[k]=Math.floor(finite(z.reputation[k],0));return z}
const MODES={easy:{xp:1.25,gold:1.25,hp:1.12,enemyHp:.8,enemyDmg:.8,drop:1.15,hardcore:false},medium:{xp:1,gold:1,hp:1,enemyHp:1,enemyDmg:1,drop:1,hardcore:false},hard:{xp:.72,gold:.72,hp:.78,enemyHp:1.45,enemyDmg:1.4,drop:.78,hardcore:false},hardcore:{xp:.55,gold:.55,hp:.62,enemyHp:1.85,enemyDmg:1.85,drop:.65,hardcore:true}};function modeCfg(){return MODES[s.mode]||MODES.medium}function scaleReward(n,k){return Math.max(1,Math.floor(n*(modeCfg()[k]||1)))}function applyDifficultyStart(){const m=modeCfg();s.maxHp=Math.max(30,Math.floor(100*m.hp));s.hp=s.maxHp;s.maxEnergy=100;s.energy=100}function selectMode(m){selectedMode=m;document.querySelectorAll('.mode-card').forEach((b,i)=>b.classList.toggle('selected',['medium','easy','hard','hardcore'][i]===m))}
function saveGame(){s=sanitize(s);setEvent('💾 Jogo guardado.','good','Save');localStorage.setItem(KEY,JSON.stringify(s));render();updateSaveInfo()} function newGame(){s=defaults();s.name=(document.getElementById('nameInput').value.trim()||'Aventureiro').slice(0,20);s.mode=selectedMode;applyDifficultyStart();localStorage.setItem(KEY,JSON.stringify(s));startGame();tutorial();showTutorial()} function loadGame(){let raw=localStorage.getItem(KEY);for(const k of OLD_KEYS){if(!raw)raw=localStorage.getItem(k)}if(!raw)return alert('Não existe nenhum save.');try{s=sanitize(JSON.parse(raw));selectedMode=s.mode;startGame()}catch(e){localStorage.removeItem(KEY);alert('Save inválido.')} }
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');startRealtimeLoop();s=sanitize(s);s.lastRealMs=Date.now();currentTab=s.currentTab||'explore';updateClock();syncDeviceClock();if(s.activeCraft&&s.gameMinutes>=s.activeCraft.endAt)finishCraft();render();updateSaveInfo()} function updateSaveInfo(){const raw=localStorage.getItem(KEY),el=document.getElementById('saveInfo'),btn=document.getElementById('loadBtn');if(!raw){el.textContent='Nenhum save encontrado.';btn.disabled=true;return}try{const x=sanitize(JSON.parse(raw));el.textContent=`Save: ${x.name} · Nível ${x.level} · Dia ${x.day}`;btn.disabled=false}catch{el.textContent='Save inválido.';btn.disabled=false}}
function deleteSaves(){const keys=[KEY,...OLD_KEYS];if(!keys.some(k=>localStorage.getItem(k)))return alert('Não existem saves para apagar.');if(!confirm('Apagar todos os saves locais de Valedouro? Esta ação não pode ser desfeita.'))return;keys.forEach(k=>localStorage.removeItem(k));document.getElementById('saveInfo').textContent='Saves apagados.';document.getElementById('loadBtn').disabled=true;}
function exportSave(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sanitize(s),null,2)],{type:'application/json'}));a.download='valedouro-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)} function show(t){currentTab=t;s.currentTab=t;render(t)} function updateClock(){s.day=Math.floor(s.gameMinutes/1440)+1;const h=Math.floor((s.gameMinutes%1440)/60),m=s.gameMinutes%60;s.time=h<12?'Manhã':h<18?'Tarde':'Noite';const gc=document.getElementById('gameClock');if(gc)gc.textContent=`Jogo ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`} function processRealTime(){if(document.getElementById('game').classList.contains('hidden'))return;const now=Date.now();if(!s.lastRealMs)s.lastRealMs=now;const elapsed=Math.max(0,Math.floor((now-s.lastRealMs)/1000));if(elapsed>0){s.lastRealMs=now;advanceTime(elapsed,elapsed<172800);if(s.activeCraft&&s.gameMinutes>=s.activeCraft.endAt)finishCraft();render(currentTab)}} function syncDeviceClock(){const rc=document.getElementById('realClock');if(rc)rc.textContent=new Date().toLocaleTimeString('pt-PT')} function updateVisibleTimers(){const t=document.getElementById('gameClock');if(t){const h=Math.floor((s.gameMinutes%1440)/60),m=s.gameMinutes%60;t.textContent=`Jogo ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} · +1 min/s`;}const live=document.querySelectorAll('.craft-live');live.forEach(el=>el.dataset.tick=Date.now());} function startRealtimeLoop(){if(realTimerStarted)return;realTimerStarted=true;setInterval(()=>{syncDeviceClock();processRealTime();updateVisibleTimers()},250);document.addEventListener('visibilitychange',()=>{if(!document.hidden)processRealTime()});window.addEventListener('focus',processRealTime)} function advanceTime(min,events=true){const oldDay=s.day;s.gameMinutes+=Math.max(0,Math.floor(min));updateClock();if(events&&s.day>oldDay){for(let d=oldDay+1;d<=s.day;d++){weatherTick();randomTimeEvent()}}for(const c of s.farming.crops){const p=PLANTS[c.type];c.readyAt=c.plantedAt+Math.floor(p.grow*Math.max(.5,1-skillLevel('agri')*.09))}for(const k in s.effects){if(k!=='_cleanup'&&s.effects[k]&&s.gameMinutes>=s.effects[k].until)delete s.effects[k]}} function advanceForAction(n){advanceTime(n);if(s.activeCraft&&s.gameMinutes>=s.activeCraft.endAt)finishCraft()} function weatherTick(){const w=rand(1,5);s.weather=w===1?'🌧️ Chuva':w===2?'🌫️ Nevoeiro':w===3?'💨 Vento forte':w===4?'☀️ Calor':'🌤️ Céu limpo'}
function setEvent(text,kind='good',meta='Agora'){s.lastEvent={text,kind,meta,at:Date.now()};s.events=s.events||[];s.events.unshift({text,kind,meta,at:Date.now()});s.events=s.events.slice(0,6);log(text)} function activeEffects(){return Object.entries(s.effects||{}).filter(([k,v])=>k!=='_cleanup'&&v&&s.gameMinutes<v.until)} function hasEffect(k){return activeEffects().some(a=>a[0]===k)} function addEffect(k,name,icon,min){s.effects[k]={name,icon,until:s.gameMinutes+min}}
function gainXP(n){s.xp+=scaleReward(Math.max(0,n),'xp');while(s.xp>=s.xpNext){s.xp-=s.xpNext;s.level++;s.xpNext=Math.floor(s.xpNext*1.32);s.maxHp+=8;s.maxEnergy+=5;s.hp=s.maxHp;s.energy=s.maxEnergy;log(`✨ Nível ${s.level}!`)}} function achievement(id,name){if(!s.achievements[id]){s.achievements[id]=true;gainXP(25);setEvent(`🏆 ${name}! +25 XP.`,'good','Conquista')}} function faction(n,v=1){s.reputation[n]=(s.reputation[n]||0)+v}
function randomTimeEvent(){s.stats.events++;const r=Math.random();if(r<.14){const g=rand(10,28)+skillLevel('fortune')*5;s.gold+=scaleReward(g,'gold');achievement('lucky','Dia de sorte');setEvent(`🍀 Encontraste ${g} ouro.`,'good','Evento feliz')}else if(r<.27){s.inv.food++;gainXP(10);setEvent('🍎 Um viajante partilhou comida.','good','Evento útil')}else if(r<.39){const d=rand(5,15);s.hp=Math.max(1,s.hp-d);setEvent(`🌧️ Um desabamento causou -${d} HP.`,'bad','Consequência')}else if(r<.50){const d=rand(8,18);s.energy=Math.max(0,s.energy-d);setEvent(`🌫️ O nevoeiro roubou ${d} energia.`,'bad','Consequência')}else if(r<.61){s.inv.map++;setEvent('🗺️ Encontraste um fragmento de mapa.','good','Evento raro')}else if(r<.72){s.inv.gems++;gainXP(18);setEvent('💎 Encontraste uma gema.','good','Evento raro')}else if(r<.82){s.gold+=scaleReward(15,'gold');faction('Maré');setEvent('🤝 Ajudaste um mercador: +15 ouro, +1 Maré.','good','Evento social')}else if(r<.91){s.inv.seed+=2;setEvent('🌱 Recebeste 2 sementes comuns.','good','Evento generoso')}else{const g=Math.min(s.gold,rand(5,12));s.gold-=g;setEvent(`🕳️ Perdeste ${g} ouro.`,'bad','Evento azarado')}}
function tutorial(){s.log=['📖 Tutorial: Bem-vindo a Valedouro.','1️⃣ Explora para obter recursos, ouro, eventos e combates.','2️⃣ Usa a Bolsa para usar consumíveis e ver atributos.','3️⃣ As Skills mostram o ganho de cada upgrade em %.','4️⃣ Viaja apenas quando tiveres o requisito.','5️⃣ A Quinta usa tempo real do mundo do jogo: planta, espera, colhe.','6️⃣ O Craft também demora tempo e pode concluir enquanto continuas a jogar.','7️⃣ Eventos aparecem no aviso no topo para não precisares de ir ao fundo.'];s.flags.tutorialDone=true} function showTutorial(){openModal(`<h2>📖 Tutorial</h2><div class="choice"><div class="card"><h3>🧭 Explorar</h3><p>Gasta energia. Podes encontrar recursos, ouro, pistas, sementes, eventos ou inimigos.</p></div><div class="card"><h3>🌿 Evoluir</h3><p>Cada Skill mostra a percentagem actual, o próximo ganho e o XP necessário.</p></div><div class="card"><h3>🌱 Quinta</h3><p>Escolhe sementes com tempos diferentes. As plantas podem sofrer mutações.</p></div><div class="card"><h3>🛠️ Craft</h3><p>Começa uma fabricação e deixa o relógio do mundo avançar. Craft reduz o tempo.</p></div><div class="card"><h3>⚔️ Loot</h3><p>Inimigos largam materiais. Bosses largam cristais e gemas.</p></div><button class="primary" onclick="closeModal()">Começar aventura</button></div>`)}
function randomWorldElement(){const r=Math.random();if(r<.34){const g=rand(12,35);s.gold+=scaleReward(g,'gold');addEffect('merchantluck','Bónus do Mercador','🧳',90);setEvent(`🧳 Mercador itinerante: +${scaleReward(g,'gold')} ouro e Bónus do Mercador por 90m.`,'good','Elemento aleatório')}else if(r<.67){s.inv.mushroom+=rand(1,3);addEffect('wildluck','Sorte selvagem','🍀',120);setEvent('🐾 Criatura rara deixou cogumelos e uma aura de Sorte selvagem.','good','Elemento aleatório')}else{s.inv.crystal+=1;addEffect('celestial','Chuva de estrelas','🌠',180);setEvent('🌠 Chuva de estrelas: +1 cristal e loot aumentado por 180m.','good','Elemento aleatório')}}
function eventExplore(){if(!spendEnergy(8))return;advanceForAction(45);s.stats.explore++;const r=Math.random();if(r<.17){const g=rand(8,26)+skillLevel('fortune')*4;s.gold+=scaleReward(g,'gold');setEvent(`🪙 +${g} ouro.`,'good','Exploração')}else if(r<.36){const keys=['wood','stone','herb','leather','mushroom'],k=keys[rand(0,keys.length-1)],n=rand(1,3)+skillLevel('gather');s.inv[k]+=n;setEvent(`🌿 +${n} ${ITEM[k].n}.`,'good','Exploração')}else if(r<.48){s.inv.treasure++;setEvent('🗝️ Encontraste uma pista de tesouro.','good','Exploração')}else if(r<.61){const ks=Object.keys(PLANTS);s.inv[ks[rand(0,ks.length-1)]]++;setEvent('🌱 Encontraste uma semente especial.','good','Exploração')}else if(r<.68&&s.inv.rope>0){s.inv.rope--;s.inv.treasure++;s.inv.ore+=2;setEvent('🪢 O atalho deu +1 pista e +2 minério.','good','Atalho')}else if(r<.68){randomWorldElement()}else if(r<.73){randomTimeEvent()}else combat();checkQuests();if(s.stats.explore>=5)achievement('explorer','Explorador persistente');render()}
function spendEnergy(n){if(s.energy<n){setEvent('⚡ Energia insuficiente.','bad','Acção cancelada');return false}s.energy-=n;return true}
function mine(){if(!['Minas de Ferrugem','Pico de Arven'].includes(s.zone)){setEvent('⛏️ Aqui não há mineração boa.','bad','Mineração');render();return}if(!canReq({skill:'gather',level:2})||!spendEnergy(10))return;advanceForAction(60);s.stats.mine++;let n=rand(1,3)+Math.floor(skillLevel('gather')/2);s.inv.ore+=n;if(Math.random()<.45)s.inv.iron++;if(Math.random()<.13+skillLevel('fortune')*.02)s.inv.gems++;if(Math.random()<.12){if(s.inv.torch){s.inv.torch--;s.inv.crystal++;setEvent('🔥 A Tocha evitou um desabamento: +1 cristal.','good','Mineração')}else{const d=rand(7,16);s.hp=Math.max(1,s.hp-d);setEvent(`🪨 Desabamento: -${d} HP.`,'bad','Mineração')}}gainXP(15);setEvent(`⛏️ +${n} minério bruto.`,'good','Mineração');if(Math.random()<.25)combat();if(s.stats.mine>=10)achievement('miner','Minerador profissional');render()}
function fish(){if(!['Pântano de Veyra','Costa de Maré','Vale de Arven'].includes(s.zone)){setEvent('🎣 Não há água adequada aqui.','bad','Pesca');render();return}if(!spendEnergy(7))return;advanceForAction(45);let n=rand(1,3)+skillLevel('fish');if(s.inv.bait){s.inv.bait--;n++;log('🪱 A isca deu pesca extra.')}if(s.weather==='🌧️ Chuva')n++;s.inv.fish+=n;s.stats.fish++;gainXP(12);faction(s.zone==='Costa de Maré'?'Maré':'Arven');setEvent(`🎣 +${n} peixe.`,'good','Pesca');if(Math.random()<.16){s.inv.treasure++;setEvent('🌊 Apanhaste uma pequena arca!','good','Pesca rara')}if(s.stats.fish>=15)achievement('angler','Pescador veterano');render()}
function craft(k){const r=recipes[k];if(!r||!canReq(r.req)){setEvent('🔒 Receita bloqueada.','bad','Crafting');render('craft');return}if(s.activeCraft){setEvent('🛠️ A oficina está ocupada.','bad','Fabricação');render('craft');return}for(const [a,b] of Object.entries(r.cost))if((s.inv[a]||0)<b){setEvent(`❌ Falta ${ITEM[a]?.n||a}.`,'bad','Crafting');render('craft');return}for(const [a,b] of Object.entries(r.cost))s.inv[a]-=b;const dur=Math.max(10,Math.floor(r.time*Math.max(.25,1-skillLevel('craft')*.08)));s.activeCraft={key:k,startAt:s.gameMinutes,endAt:s.gameMinutes+dur};setEvent(`🛠️ ${r.name} começou. Tempo: ${formatMinutes(dur)}.`,'good','Fabricação');render('craft')}
function finishCraft(){if(!s.activeCraft)return;const k=s.activeCraft.key,r=recipes[k];if(!r){s.activeCraft=null;return}if(r.out)for(const [a,b] of Object.entries(r.out))s.inv[a]+=b;if(k==='sword')s.equip.weapon='Espada de Ferro';if(k==='crystalBlade')s.equip.weapon='Lâmina de Cristal';if(k==='towerShield')s.equip.armor='Escudo Torre (+8 Defesa)';if(k==='hunterKnife')s.equip.weapon='Faca de Caçador';s.stats.crafted++;gainXP(10+skillLevel('craft')*3);s.activeCraft=null;achievement(s.stats.crafted>=5?'crafter':'_none','Artesão dedicado');setEvent(`✅ ${r.name} terminou.`,'good','Oficina');checkQuests()}
function cropReady(c){return s.gameMinutes>=c.readyAt} function plant(type){const p=PLANTS[type];if(!p||!s.inv[type]){setEvent('🌱 Não tens essa semente.','bad','Quinta');return}if(s.farming.crops.length>=s.farming.slots){setEvent('🌱 Todos os canteiros estão ocupados.','bad','Quinta');return}s.inv[type]--;const dur=Math.floor(p.grow*Math.max(.5,1-skillLevel('agri')*.09));s.farming.crops.push({type,plantedAt:s.gameMinutes,readyAt:s.gameMinutes+dur});setEvent(`${p.icon} ${p.name} plantada. Fica pronta em ${formatMinutes(dur)}.`,'good','Quinta');render('farm')}
function harvest(){const ready=s.farming.crops.filter(cropReady);if(!ready.length){setEvent('🌱 Ainda não há plantas prontas.','bad','Quinta');render('farm');return}s.farming.crops=s.farming.crops.filter(c=>!cropReady(c));let total=0;for(const c of ready){const p=PLANTS[c.type];let q=p.yield+Math.floor(skillLevel('agri')/2),mut='';if(Math.random()<p.mutate+skillLevel('agri')*.02){mut=['golden','giant','charged'][rand(0,2)];if(mut==='golden'){q++;s.inv.goldenCrop++}if(mut==='giant'){q*=3;s.inv.giantCrop++}if(mut==='charged'){s.inv.chargedCrop++;addEffect('speed','Velocidade','⚡',180)}}s.inv[p.harvest]+=q;if(c.type==='seedSunroot'&&currentHour()<18)addEffect('sunheal','Cura Solar','☀️',180);if(c.type==='seedMoonberry'&&currentHour()>=18)addEffect('moonenergy','Energia Lunar','🌙',180);if(c.type==='seedEmberpepper')addEffect('fury','Fúria','🔥',1440);total+=q;log(`🌾 ${p.name}: +${q}${mut?` · MUTOU ${mut}`:''}.`)}s.farming.harvested+=total;gainXP(8+total*3);setEvent(`🌾 Colheita: +${total} em ${ready.length} plantas.`,'good','Quinta');render('farm')}
function currentHour(){return Math.floor((s.gameMinutes%1440)/60)} function cooking(){if(s.inv.wheat<2||s.inv.fish<1){setEvent('🍳 Precisas de 2 trigo + 1 peixe.','bad','Cozinha');return}s.inv.wheat-=2;s.inv.fish--;s.inv.food+=2;advanceForAction(20);gainXP(15);setEvent('🍳 Cozinhaste 2 refeições.','good','Cozinha');render('farm')}
function useItem(k){if(!s.inv[k])return;let u=false;if(k==='staminaTea'){s.inv[k]--;s.energy=Math.min(s.maxEnergy,s.energy+35);addEffect('vigor','Vigor','⚡',120);u=true}else if(k==='honeyTea'){s.inv[k]--;s.hp=Math.min(s.maxHp,s.hp+30);s.energy=Math.min(s.maxEnergy,s.energy+20);u=true}else if(k==='magicTonic'){s.inv[k]--;s.energy=Math.min(s.maxEnergy,s.energy+20);addEffect('arcaneLuck','Fortuna Arcana','✨',120);u=true}else if(k==='fishingNet'){s.inv[k]--;addEffect('netBoost','Rede de pesca','🕸️',120);u=true}else if(k==='treasureCompass'){s.inv[k]--;s.inv.treasure++;u=true}else if(k==='smokeBomb'){s.inv[k]--;addEffect('smokeEscape','Fuga por fumo','💨',480);u=true}else if(k==='luckyCharm'){s.inv[k]--;addEffect('luckyCharm','Amuleto da sorte','🍀',720);u=true}else if(k==='repairKit'){s.inv[k]--;s.equip.enchant=Math.max(0,s.equip.enchant);addEffect('repair','Equipamento reparado','🔧',360);u=true}else if(k==='honey') {s.inv[k]--;s.energy=Math.min(s.maxEnergy,s.energy+15);u=true}else if(k==='berry'){s.inv[k]--;s.hp=Math.min(s.maxHp,s.hp+8);u=true}else if(k==='food'){s.inv.food--;s.hp=Math.min(s.maxHp,s.hp+25);s.energy=Math.min(s.maxEnergy,s.energy+15);u=true}else if(k==='potion'){s.inv.potion--;s.hp=Math.min(s.maxHp,s.hp+35);u=true}else if(k==='bandage'){s.inv.bandage--;s.hp=Math.min(s.maxHp,s.hp+22);u=true}else if(k==='mushroom'){s.inv.mushroom--;const r=Math.random();if(r<.34)s.hp=Math.min(s.maxHp,s.hp+35);else if(r<.67)s.energy=Math.min(s.maxEnergy,s.energy+30);else{s.hp=Math.max(1,s.hp-8);gainXP(18)}u=true}else if(k==='map'){s.inv.map--;s.inv.treasure++;u=true}else if(k==='sunroot'){s.inv.sunroot--;s.hp=Math.min(s.maxHp,s.hp+50);addEffect('sunheal','Cura Solar','☀️',180);u=true}else if(k==='moonberry'){s.inv.moonberry--;s.energy=Math.min(s.maxEnergy,s.energy+35);addEffect('moonenergy','Energia Lunar','🌙',180);u=true}else if(k==='emberpepper'){s.inv.emberpepper--;addEffect('fury','Fúria','🔥',1440);u=true}else if(k==='crystalflower'){s.inv.crystalflower--;s.inv.gems++;u=true}setEvent(u?`🎒 Usaste ${ITEM[k].n}.`:'ℹ️ Esse item não pode ser usado agora.','good','Bolsa');render('inventory')}
function treasure(){if(s.inv.treasure){s.inv.treasure--;const g=rand(30,90)+skillLevel('fortune')*12;s.gold+=scaleReward(g,'gold');gainXP(35);s.stats.treasures++;if(Math.random()<.28)s.inv.gems++;if(Math.random()<.18)s.inv.crystal++;setEvent(`💰 Tesouro: +${g} ouro.`,'good','Tesouro');if(s.stats.treasures>=5)achievement('treasure','Caçador de tesouros')}else if(s.inv.lockpick){s.inv.lockpick--;const g=rand(20,55);s.gold+=scaleReward(g,'gold');setEvent(`🗝️ Cofre aberto: +${g} ouro.`,'good','Gazua')}else setEvent('🔍 Não tens pista nem gazua.','bad','Tesouro');render()}
function travel(i){const z=zones[i];if(!canReq(z.req)){setEvent(`🔒 ${z.name}: ${reqText(z.req)}`,'bad','Viagem');render();return}if(z.name===s.zone)return;if(!spendEnergy(12))return;s.zone=z.name;advanceForAction(90);if(z.faction)faction(z.faction);setEvent(`🧭 Chegaste a ${z.name}.`,'good','Viagem');render()}
function combat(){const c0=modeCfg(),boss=s.level>=5&&Math.random()<.16,enemy=boss?'Guardião Antigo':['Lobo','Bandido','Slime','Aranha','Javali'][rand(0,4)],baseHp=boss?70+16*s.level:22+6*s.level,ehp=Math.floor(baseHp*c0.enemyHp);combatState={ehp,maxEhp:ehp,boss,enemy,guard:false,cooldown:0};renderCombat()}
function renderCombat(){const c=combatState;if(!c)return;openModal(`<h2>⚔️ ${c.enemy}${c.boss?' 👑':''}</h2><div class="combat-hud"><div class="hpbox"><strong><span>❤️ Tu</span><span>${s.hp}/${s.maxHp}</span></strong><div class="combatbar"><div class="hp" style="width:${pct(s.hp,s.maxHp)}%"></div></div><small class="muted">⚡ ${s.energy}/${s.maxEnergy}</small></div><div class="hpbox"><strong><span>👹 Inimigo</span><span>${Math.max(0,c.ehp)}/${c.maxEhp}</span></strong><div class="combatbar"><div class="hp" style="width:${pct(c.ehp,c.maxEhp)}%"></div></div><small class="muted">${c.cooldown>0?'✨ Especial em '+c.cooldown+' turno(s)':''}</small></div></div><div id="combatInfo" class="tip">${c.guard?'🛡️ Guarda activa.':''}</div><div class="combat-actions"><button class="primary" onclick="attackEnemy()">⚔️ Ataque</button><button onclick="powerStrike()" ${s.energy<15||c.cooldown>0?'disabled':''}>✨ Especial · 15⚡</button><button onclick="guard()">🛡️ Defender</button><button onclick="combatPotion()">🧪 Poção</button><button onclick="flee()">🏃 Fugir</button></div>`)}
function enemyLoot(e,b){const m={Lobo:[['leather',1,.75],['food',1,.12]],Bandido:[['leather',1,.65],['iron',1,.35],['lockpick',1,.08]],Slime:[['herb',1,.65],['gems',1,.08]],Aranha:[['leather',1,.8],['herb',1,.35]],Javali:[['leather',2,.7],['food',1,.4]]};const mult=modeCfg().drop;for(const [k,n,ch] of m[e]||[])if(Math.random()<Math.min(1,ch*mult))s.inv[k]+=n;if(b){s.inv.crystal++;s.inv.gems++;}}
function endCombatWin(c,g){s.gold+=scaleReward(g,'gold');gainXP(c.boss?100:28);s.stats.combatWins++;enemyLoot(c.enemy,c.boss);if(c.boss)achievement('boss','Guardião derrotado');setEvent(`🏆 ${c.enemy} derrotado: +${scaleReward(g,'gold')} ouro + loot.`,'good','Combate');closeModal();render()}
function enemyTurn(){const c=combatState;if(!c)return;let ed=Math.floor((rand(3,9)+(c.boss?5:0))*modeCfg().enemyDmg);if(c.guard)ed=Math.ceil(ed*.35);const hit=Math.max(1,ed-s.equip.enchant);s.hp-=hit;c.guard=false;c.cooldown=Math.max(0,(c.cooldown||0)-1);if(s.hp<=0){if(modeCfg().hardcore){localStorage.removeItem(KEY);alert('💀 Hardcore: morreste. Tens de começar um Novo Jogo.');location.reload();return} s.hp=s.maxHp;s.energy=s.maxEnergy;s.gold=Math.max(0,s.gold-10);s.zone='Vale de Arven';setEvent('☠️ Foste derrotado. Perdeste 10 ouro.','bad','Respawn');closeModal();render()}}
function attackEnemy(){const c=combatState;if(!c)return;const base=s.equip.weapon==='Espada de Ferro'?10:s.equip.weapon==='Lâmina de Cristal'?13:7,dmg=Math.floor((rand(base,base+6)+skillLevel('combat')*2+s.equip.enchant*2)*(1+skillLevel('combat')*.05)*(hasEffect('fury')?1.2:1));c.ehp-=dmg;if(c.ehp<=0){endCombatWin(c,(c.boss?90:10)+rand(0,18));return}enemyTurn();if(combatState)renderCombat()}
function powerStrike(){const c=combatState;if(!c||s.energy<15||c.cooldown>0)return;s.energy-=15;c.cooldown=2;const dmg=Math.floor((18+skillLevel('combat')*3+s.equip.enchant*3)*(hasEffect('fury')?1.3:1));c.ehp-=dmg;if(c.ehp<=0){endCombatWin(c,(c.boss?100:14)+rand(0,20));return}enemyTurn();if(combatState)renderCombat()}
function guard(){const c=combatState;if(!c)return;c.guard=true;s.energy=Math.min(s.maxEnergy,s.energy+5);enemyTurn();if(combatState)renderCombat()}
function combatPotion(){if(!s.inv.potion)return;s.inv.potion--;s.hp=Math.min(s.maxHp,s.hp+35);enemyTurn();if(combatState)renderCombat()} function flee(){if(hasEffect('smokeEscape')){delete s.effects.smokeEscape;setEvent('💨 A bomba de fumo garantiu a fuga.','good','Combate');closeModal();render();return}if(Math.random()<.7+skillLevel('fortune')*.03){setEvent('🏃 Escapaste.','good','Combate');closeModal();render()}else{enemyTurn();if(combatState)renderCombat()}}
function sellAllMarket(){let total=0;for(const k of Object.keys(ITEM)){const x=ITEM[k];if(!x||['utility','rare'].includes(x.cat))continue;const prices={wood:2,stone:2,iron:8,ore:3,herb:4,leather:7,fish:5,wheat:3,plank:5,brick:5,copper:12,silver:28,honey:10,berry:4,magicDust:35,feather:3,spiderSilk:8,coalBundle:9};if(!prices[k])continue;const q=s.inv[k]||0;if(q){total+=scaleReward(q*prices[k],'gold');s.inv[k]=0}}s.gold+=total;setEvent(`💰 Venda total: +${total} ouro.`,'good','Mercado');render('town')} function bulkSell(k,qty,p){qty=Math.max(0,Math.min(Math.floor(Number(qty)||0),s.inv[k]||0));if(!qty){setEvent('🪙 Nada para vender.','bad','Mercado');render('town');return}const total=scaleReward(qty*p,'gold');s.inv[k]-=qty;s.gold+=total;setEvent(`🪙 Vendeste ${qty}× ${ITEM[k].n} por ${total} ouro.`,'good','Mercado');render('town')} function sellAll(k,p){bulkSell(k,s.inv[k]||0,p)} function buy(k,p){if(s.gold<p){setEvent('🪙 Ouro insuficiente.','bad','Mercado');render('town');return}s.gold-=p;s.inv[k]++;setEvent(`🛒 Compraste ${ITEM[k].n}.`,'good','Mercado');render('town')} function sell(k,p){if(!s.inv[k])return;s.inv[k]--;s.gold+=p;setEvent(`🪙 Vendeste ${ITEM[k].n}.`,'good','Mercado');render('town')} function petName(){return s.petActive||'Nenhum'} function petData(name){return s.pets[name]} function petBonus(name){const p=s.pets[name];if(!p)return '';if(name==='Raposa')return `+${p.level*2}% ouro/loot`;if(name==='Corvo')return `+${p.level}% rendimento de recolha`;return `+${p.level*2}% dano a inimigos`} function upgradePet(name){const p=s.pets[name];if(!p)return;const cost=p.level*40;if((s.gold||0)<cost){setEvent(`🐾 Precisas de ${cost} ouro para melhorar ${name}.`,'bad','Pet');render('pets');return}s.gold-=cost;p.level++;p.xp=0;setEvent(`🐾 ${name} subiu para nível ${p.level}.`,'good','Pet');render('pets')} function trainPet(){if(!s.petActive){setEvent('🐾 Primeiro escolhe um pet activo.','bad','Pet');render('pets');return}const p=s.pets[s.petActive];p.xp+=20+skillLevel('fortune')*5;if(p.xp>=p.level*50){p.xp-=p.level*50;p.level++;setEvent(`🐾 ${s.petActive} treinou e chegou ao nível ${p.level}.`,'good','Pet')}else setEvent(`🐾 ${s.petActive} ganhou experiência.`,'good','Pet');render('pets')} function setPet(name){if(!s.pets[name])return;s.petActive=name;setEvent(`🐾 ${name} está agora activo.`,'good','Pet');render('pets')}

function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showCreateParty(){
  document.getElementById('coopCard').innerHTML=`<h2>🏕️ Criar party</h2><label>Nome</label><input id="coopName" maxlength="20" placeholder="Nome do aventureiro"><div style="height:9px"></div><label>Jogadores</label><div class="coop-grid" id="coopSize"><button class="coop-option selected" onclick="pickCoopSize(this,2)">👥 2 jogadores</button><button class="coop-option" onclick="pickCoopSize(this,3)">👥 3 jogadores</button><button class="coop-option" onclick="pickCoopSize(this,4)">👥 4 jogadores</button><button class="coop-option" onclick="pickCoopSize(this,5)">👥 5 jogadores</button></div><div style="height:9px"></div><label>Dificuldade</label><div class="coop-grid" id="coopDiff"><button class="coop-option selected" onclick="pickCoopDiff(this,'medium')">⚖️ Medium</button><button class="coop-option" onclick="pickCoopDiff(this,'easy')">🌱 Easy</button><button class="coop-option" onclick="pickCoopDiff(this,'hard')">🔥 Hard</button><button class="coop-option" onclick="pickCoopDiff(this,'hardcore')">💀 Hardcore</button></div><div style="height:9px"></div><button class="coop-option" style="width:100%" onclick="togglePrivateParty()">🔒 Party privada <span id="privateMark">OFF</span></button><div id="privatePassWrap" class="hidden" style="margin-top:9px"><input id="coopPassword" type="password" maxlength="30" placeholder="Senha da party"></div><div class="actions" style="margin-top:12px"><button onclick="openCoopMenu()">Voltar</button><button class="primary" onclick="createParty()">Criar</button></div>`;
}
function pickCoopSize(el,n){coopCfg.maxPlayers=n;document.querySelectorAll('#coopSize .coop-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function pickCoopDiff(el,d){coopCfg.difficulty=d;document.querySelectorAll('#coopDiff .coop-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function togglePrivateParty(){coopCfg.private=!coopCfg.private;document.getElementById('privateMark').textContent=coopCfg.private?'ON':'OFF';document.getElementById('privatePassWrap').classList.toggle('hidden',!coopCfg.private)}
function showJoinParty(){
 document.getElementById('coopCard').innerHTML=`<h2>🚪 Entrar numa party</h2><input id="joinName" maxlength="20" placeholder="Nome do aventureiro"><div style="height:9px"></div><input id="joinCode" maxlength="8" placeholder="Código da party" autocapitalize="characters" autocomplete="off"><div style="height:9px"></div><input id="joinPass" type="password" maxlength="30" placeholder="Senha (se privada)"><div class="actions" style="margin-top:12px"><button onclick="openCoopMenu()">Voltar</button><button class="primary" onclick="joinParty()">Entrar</button></div>`;
}
function createPeerForHost(code, onReady){
 if(typeof Peer==='undefined'){alert('A biblioteca de Coop não carregou. Verifica a internet e abre o ficheiro novamente.');return}
 coopResetPeer();
 const peerId=coopPeerIdFromCode(code);
 coopPeer=new Peer(peerId);
 coopPeer.on('open',id=>{coopConnected=true;coopHost=true;coopPlayerId=id;onReady()});
 coopPeer.on('connection',conn=>{attachHostConnection(conn)});
 coopPeer.on('error',err=>{
   if(err&&err.type==='unavailable-id'&&coopHost){
     const fresh=coopCode(); coopRoom=fresh; createPeerForHost(fresh,onReady); return;
   }
   console.warn('PeerJS',err);
   if(err&&['network','server-error','socket-error','socket-closed'].includes(err.type)) alert('Não foi possível ligar ao serviço Coop. Verifica a internet e tenta novamente.');
 });
 coopPeer.on('disconnected',()=>{coopConnected=false; if(coopRoom)renderPartyLobby('🔌 A sinalização foi desligada. As ligações já abertas podem continuar.')});
}
function createParty(){
 coopName=(document.getElementById('coopName').value.trim()||'Aventureiro').slice(0,20);
 if(coopCfg.private){coopCfg.password=document.getElementById('coopPassword').value||'';if(!coopCfg.password)return alert('Define uma senha para a party privada.')} else coopCfg.password='';
 coopRoom=coopCode();coopHostSecret=coopCfg.password;coopChatHistory=[];
 coopPlayers=[{id:'',name:coopName,host:true}];
 coopStatus('A criar party…');
 createPeerForHost(coopRoom,()=>{coopPlayers[0].id=coopPlayerId;renderPartyLobby('✅ Party criada. Partilha o código com o teu amigo.');});
}
function joinParty(){
 coopName=(document.getElementById('joinName').value.trim()||'Aventureiro').slice(0,20);
 const code=document.getElementById('joinCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
 if(code.length!==6)return alert('O código deve ter 6 caracteres.');
 const password=document.getElementById('joinPass').value||'';
 coopRoom=code;coopHost=false;coopHostSecret=password;coopChatHistory=[];
 if(typeof Peer==='undefined'){alert('A biblioteca de Coop não carregou. Verifica a internet e abre o ficheiro novamente.');return}
 coopResetPeer();
 coopStatus('A ligar à party…');
 coopPeer=new Peer();
 coopPeer.on('open',id=>{
   coopConnected=true;coopPlayerId=id;
   const conn=coopPeer.connect(coopPeerIdFromCode(code),{reliable:true,metadata:{name:coopName}});
   coopConnections=[conn];
   conn.on('open',()=>conn.send({type:'join',name:coopName,password:password,playerId:coopPlayerId}));
   conn.on('data',handleJoinerMessage); conn.on('close',()=>{if(coopRoom)renderPartyLobby('🔌 O host saiu da party.')});
   conn.on('error',()=>alert('Não foi possível entrar na party. Confirma o código e tenta novamente.'));
 });
 coopPeer.on('error',err=>{console.warn('PeerJS',err); if(err&&err.type==='network')alert('Sem ligação ao serviço Coop.');});
}
function attachHostConnection(conn){
 coopConnections.push(conn);
 conn.on('open',()=>{});
 conn.on('data',data=>{
   if(!data||typeof data!=='object')return;
   if(data.type==='join'){
     if(coopPlayers.length>=coopCfg.maxPlayers){conn.send({type:'error',message:'A party já está cheia.'});conn.close();return}
     if(coopCfg.private && String(data.password||'')!==String(coopHostSecret)){conn.send({type:'error',message:'Senha incorreta.'});conn.close();return}
     if(coopPlayers.some(p=>p.id===data.playerId)){conn.close();return}
     const p={id:String(data.playerId||''),name:String(data.name||'Aventureiro').slice(0,20),host:false};
     coopPlayers.push(p); conn.playerId=p.id; conn.playerName=p.name;
     conn.send({type:'welcome',room:coopRoom,maxPlayers:coopCfg.maxPlayers,difficulty:coopCfg.difficulty,private:coopCfg.private,players:coopPlayers,chat:coopChatHistory});
     hostBroadcastParty(); renderPartyLobby('✅ Um jogador entrou na party.'); return;
   }
   if(!conn.playerId)return;
   if(data.type==='chat'){const chatMsg={type:'chat',name:conn.playerName||'Aventureiro',text:String(data.text||'').slice(0,180)};coopChatHistory.push({name:chatMsg.name,text:chatMsg.text});if(coopChatHistory.length>50)coopChatHistory.shift();appendCoopChat(chatMsg.name,chatMsg.text);hostBroadcast(chatMsg);return}
   if(data.type==='event'){hostBroadcast({type:'event',name:conn.playerName||'Aventureiro',text:String(data.text||'').slice(0,180)});return}
   if(data.type==='leave'){removeHostPlayer(conn.playerId,conn)}
 });
 conn.on('close',()=>{if(conn.playerId)removeHostPlayer(conn.playerId,conn)});
 conn.on('error',()=>{if(conn.playerId)removeHostPlayer(conn.playerId,conn)});
}
function removeHostPlayer(id,conn){
 coopPlayers=coopPlayers.filter(p=>p.id!==id);
 coopConnections=coopConnections.filter(c=>c!==conn);
 try{conn.close()}catch(e){}
 hostBroadcastParty();
 renderPartyLobby('🔌 Um jogador saiu.');
}
function hostBroadcast(msg){coopConnections.slice().forEach(c=>{try{if(c.open)c.send(msg)}catch(e){}})}
function hostBroadcastParty(){hostBroadcast({type:'party',players:coopPlayers,maxPlayers:coopCfg.maxPlayers,difficulty:coopCfg.difficulty,private:coopCfg.private,hostId:coopPlayerId})}
function handleJoinerMessage(m){
 if(m.type==='error'){alert(m.message||'Erro ao entrar na party.');leaveParty();return}
 if(m.type==='welcome'||m.type==='party'){coopPlayers=m.players||[];coopCfg.maxPlayers=m.maxPlayers||coopCfg.maxPlayers;coopCfg.difficulty=m.difficulty||coopCfg.difficulty;coopCfg.private=!!m.private;if(Array.isArray(m.chat))coopChatHistory=m.chat.slice(-50);renderPartyLobby(m.type==='welcome'?'✅ Entraste na party.':'');return}
 if(m.type==='started'){coopCfg.difficulty=m.difficulty;startCoopGame(m);return}
 if(m.type==='chat'){appendCoopChat(m.name,m.text);return}
 if(m.type==='event'){addCoopEvent(m);return}
}
function renderPartyLobby(note=''){
 const meHost=coopHost;
 document.getElementById('coopCard').innerHTML=`<h2>🏕️ Party <span class="badge">${escapeHtml(coopRoom||'')}</span></h2><div class="coop-code">${escapeHtml(coopRoom||'')}</div><p class="muted" style="text-align:center">${coopCfg.private?'🔒 Privada · partilha código + senha':'🌐 Partilha o código com o teu amigo'}</p>${note?`<div class="tip">${escapeHtml(note)}</div>`:''}<section class="panel" style="margin:10px 0"><b>👥 Jogadores ${coopPlayers.length}/${coopCfg.maxPlayers}</b><div class="coop-players" style="margin-top:8px">${coopPlayers.map(p=>`<div class="coop-player"><span>🧙 ${escapeHtml(p.name)} ${p.id===coopPlayerId?'(tu)':''}</span><span class="coop-status"><i class="coop-dot"></i>${p.host?'Host':'Ligado'}</span></div>`).join('')}</div></section><div class="card"><b>⚙️ ${escapeHtml(String(coopCfg.difficulty).toUpperCase())}</b><p>Todos usam a mesma dificuldade nesta sessão.</p></div><section class="panel" style="margin:10px 0"><b>💬 Chat</b><div class="coop-chat" style="margin-top:8px"></div><div class="actions" style="margin-top:8px"><input id="coopChatInput" maxlength="180" placeholder="Escreve uma mensagem" onkeydown="if(event.key==='Enter')sendCoopChat()"><button onclick="sendCoopChat()">Enviar</button></div></section><div class="actions" style="margin-top:10px">${meHost?`<button class="primary" onclick="startParty()" ${coopPlayers.length<2?'disabled':''}>🚀 Começar aventura</button>`:''}<button onclick="leaveParty()">Sair da party</button></div>`;
 const chat=document.getElementById('coopCard').querySelector('.coop-chat');
 if(chat)coopChatHistory.forEach(m=>{const d=document.createElement('div');d.className='coop-msg';d.innerHTML=`<b>${escapeHtml(m.name)}:</b> ${escapeHtml(m.text)}`;chat.appendChild(d);});
 if(chat)chat.scrollTop=chat.scrollHeight;
}
function startParty(){
 if(!coopHost)return;
 const msg={type:'started',difficulty:coopCfg.difficulty,room:coopRoom,players:coopPlayers};
 hostBroadcast(msg); startCoopGame(msg);
}
function startCoopGame(m){
 closeCoop(); if(typeof selectMode==='function')selectMode(m.difficulty||coopCfg.difficulty); document.getElementById('nameInput').value=coopName; newGame(); setEvent(`👥 Entraste numa aventura Coop! Party ${coopRoom} · ${coopPlayers.length} jogadores.`,'good','Coop'); render();
}
function leaveParty(){
 if(coopHost){hostBroadcast({type:'error',message:'O host encerrou a party.'});}
 else if(coopConnections[0]&&coopConnections[0].open)try{coopConnections[0].send({type:'leave'})}catch(e){}
 coopResetPeer();coopRoom=null;coopPlayers=[];coopHost=false;coopPlayerId=null;closeCoop();
}
function appendCoopChat(name,text){
 const card=document.getElementById('coopCard');if(!card)return;let chat=card.querySelector('.coop-chat');if(!chat)return;const d=document.createElement('div');d.className='coop-msg';d.innerHTML=`<b>${escapeHtml(name)}:</b> ${escapeHtml(text)}`;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function sendCoopChat(){
 const i=document.getElementById('coopChatInput');if(!i||!i.value.trim())return;const text=i.value.trim().slice(0,180);
 if(coopHost){
   coopChatHistory.push({name:coopName,text});if(coopChatHistory.length>50)coopChatHistory.shift();
   appendCoopChat(coopName,text);hostBroadcast({type:'chat',name:coopName,text});
 }else if(coopConnections[0]&&coopConnections[0].open){
   coopConnections[0].send({type:'chat',text});
 }
 i.value='';
}
function addCoopEvent(m){if(typeof setEvent==='function')setEvent(`👥 ${escapeHtml(m.name)}: ${escapeHtml(m.text)}`,'good','Party');if(typeof render==='function')render()}
(function(){
 const names=['eventExplore','fish','mine','treasure','travel','craft','combat'];
 const labels={eventExplore:'explorou',fish:'foi pescar',mine:'foi minerar',treasure:'procurou um tesouro',travel:'viajou',craft:'começou crafting',combat:'entrou em combate'};
 names.forEach(fn=>{if(typeof window[fn]!=='function')return;const original=window[fn];window[fn]=function(...args){const r=original.apply(this,args);if(coopRoom){const text=labels[fn]||fn;if(coopHost){hostBroadcast({type:'event',name:coopName,text})}else if(coopConnections[0]&&coopConnections[0].open){coopConnections[0].send({type:'event',text})}}return r}});
})();
</script>

<script>
/* =========================================================
   V13 — classes, equipment, gallery chat & Coop gifting
   ========================================================= */
const CLASS_INFO={
  neutral:{name:'Aventureiro',icon:'🧭',desc:'Classe neutra. Não altera atributos nem estilo de jogo.',mods:{},weapons:'Qualquer arma.'},
  warrior:{name:'Guerreiro',icon:'⚔️',desc:'Especialista em combate corpo a corpo. Mais Força, menos Energia e espadas como arma principal.',mods:{str:20,en:-10},weapons:'Espadas'},
  berserker:{name:'Berserker',icon:'🪓',desc:'Luta com pura força. Muito dano, mas pouca Defesa e Energia.',mods:{str:30,en:-20,def:-10},weapons:'Machados'},
  guardian:{name:'Guardião',icon:'🛡️',desc:'Tanque resistente. Mais Defesa e Vida, mas menos Energia.',mods:{def:25,hp:15,en:-10},weapons:'Espadas e escudos'},
  ranger:{name:'Arqueiro',icon:'🏹',desc:'Ágil e preciso. Mais Agilidade e Sorte, com arcos como arma principal.',mods:{agi:25,luck:10},weapons:'Arcos'},
  mage:{name:'Mago',icon:'🔮',desc:'Canaliza energia arcana. Muito mais Energia, mas menos Vida.',mods:{en:30,hp:-10},weapons:'Cajados'},
  rogue:{name:'Ladino',icon:'🗡️',desc:'Rápido e oportunista. Mais Agilidade e Sorte, mas menos Defesa.',mods:{agi:25,luck:15,def:-10},weapons:'Adagas'},
  cleric:{name:'Clérigo',icon:'✨',desc:'Especialista em suporte e cura. Mais Energia e Poder de cura, menos Força.',mods:{en:20,heal:25,str:-10},weapons:'Maças e cajados'},
  druid:{name:'Druida',icon:'🌿',desc:'Ligado à natureza. Melhora recolha, agricultura e Energia.',mods:{en:15,gather:20,agri:20},weapons:'Cajados'},
  alchemist:{name:'Alquimista',icon:'⚗️',desc:'Mestre de poções e recursos. Craft e efeitos de consumíveis são melhores.',mods:{craft:25,heal:15},weapons:'Adagas'}
};
const EQUIP={
 ironHelmet:{n:'Elmo de Ferro',i:'⛑️',d:'+6 Defesa.',cat:'equipment',slot:'helmet',def:6},
 leatherHelmet:{n:'Capuz de Couro',i:'🧢',d:'+3 Defesa, leve.',cat:'equipment',slot:'helmet',def:3},
 ironChest:{n:'Peitoral de Ferro',i:'🦺',d:'+12 Defesa.',cat:'equipment',slot:'chest',def:12},
 leatherChest:{n:'Peitoral de Couro',i:'🥋',d:'+6 Defesa e leve.',cat:'equipment',slot:'chest',def:6},
 ironBoots:{n:'Botas de Ferro',i:'🥾',d:'+5 Defesa.',cat:'equipment',slot:'boots',def:5},
 explorerBoots2:{n:'Botas de Explorador',i:'👢',d:'+2 Defesa e -5% energia de viagens.',cat:'equipment',slot:'boots',def:2,travel:-5},
 ironPants:{n:'Calças de Ferro',i:'👖',d:'+7 Defesa.',cat:'equipment',slot:'pants',def:7},
 leatherPants:{n:'Calças de Couro',i:'🩳',d:'+4 Defesa.',cat:'equipment',slot:'pants',def:4},
 ironSword:{n:'Espada de Ferro',i:'⚔️',d:'+10 Ataque.',cat:'equipment',slot:'weaponMain',damage:10,kind:'sword'},
 crystalSword:{n:'Espada de Cristal',i:'🗡️',d:'+16 Ataque.',cat:'equipment',slot:'weaponMain',damage:16,kind:'sword'},
 hunterBow:{n:'Arco de Caçador',i:'🏹',d:'+11 Ataque e +5% Sorte.',cat:'equipment',slot:'weaponMain',damage:11,luck:5,kind:'bow'},
 battleAxe:{n:'Machado de Batalha',i:'🪓',d:'+14 Ataque, -5 Energia.',cat:'equipment',slot:'weaponMain',damage:14,en:-5,kind:'axe'},
 arcaneStaff:{n:'Cajado Arcano',i:'🪄',d:'+9 Ataque e +12 Energia máxima.',cat:'equipment',slot:'weaponMain',damage:9,en:12,kind:'staff'},
 ironDagger:{n:'Adaga de Ferro',i:'🔪',d:'+8 Ataque e +8 Agilidade.',cat:'equipment',slot:'weaponMain',damage:8,agi:8,kind:'dagger'},
 mace:{n:'Maça',i:'🔨',d:'+9 Ataque e +5% cura.',cat:'equipment',slot:'weaponMain',damage:9,heal:5,kind:'mace'},
 buckler:{n:'Broquel',i:'🛡️',d:'+7 Defesa.',cat:'equipment',slot:'weaponSecondary',def:7,kind:'shield'},
 towerShield2:{n:'Escudo Torre',i:'🛡️',d:'+14 Defesa, -5 Energia.',cat:'equipment',slot:'weaponSecondary',def:14,en:-5,kind:'shield'},
 magicOrb:{n:'Orbe Arcano',i:'🔮',d:'+8 Energia máxima.',cat:'equipment',slot:'weaponSecondary',en:8,kind:'orb'}
};
Object.assign(ITEM,EQUIP);
const OLD_SANITIZE_V13=sanitize;
sanitize=function(x){
  const z=OLD_SANITIZE_V13(x); z.classId=CLASS_INFO[z.classId]?z.classId:'neutral';
  z.classMods=Object.assign({},CLASS_INFO[z.classId].mods);
  z.equip=Object.assign({helmet:null,chest:null,boots:null,pants:null,weaponMain:null,weaponSecondary:null,weapon:'Faca de viajante',armor:'Roupa simples',enchant:0},z.equip||{});
  for(const k of Object.keys(EQUIP)) z.inv[k]=Math.max(0,Math.floor(Number(z.inv[k])||0));
  z.inv.ironHelmet=Math.max(z.inv.ironHelmet,0); z.inv.leatherChest=Math.max(z.inv.leatherChest,0);
  return z;
};
function classBonus(key,stat){return Number((CLASS_INFO[s.classId||'neutral'].mods||{})[stat]||0)}
function equipmentBonus(stat){let n=0;for(const slot of ['helmet','chest','boots','pants','weaponMain','weaponSecondary']){const k=s.equip?.[slot];if(k&&EQUIP[k])n+=Number(EQUIP[k][stat]||0)}return n}
function equipmentDamage(){const k=s.equip?.weaponMain;return k&&EQUIP[k]?Number(EQUIP[k].damage||0):0}
function chooseClass(key){if(!CLASS_INFO[key])return;selectedClass=key;document.querySelectorAll('.class-card').forEach(b=>b.classList.toggle('selected',b.dataset.cls===key));const d=document.getElementById('classDesc');if(d)d.innerHTML=`<b>${CLASS_INFO[key].icon} ${CLASS_INFO[key].name}</b><br>${CLASS_INFO[key].desc}<br><small>Armas: ${CLASS_INFO[key].weapons}</small>`}
let selectedClass='neutral';
function showClassChooser(){
 const cards=Object.entries(CLASS_INFO).map(([k,c])=>`<button type="button" class="card class-card ${k===selectedClass?'selected':''}" data-cls="${k}" onclick="chooseClass('${k}')"><h3>${c.icon} ${c.name}</h3><p>${c.desc}</p></button>`).join('');
 openModal(`<h2>🧙 Escolhe a tua classe</h2><p class="muted">A classe define o teu estilo inicial. Podes consultar a descrição antes de escolher.</p><div class="class-grid">${cards}</div><div id="classDesc" class="tip" style="margin-top:10px"></div><div class="actions" style="margin-top:10px"><button onclick="closeModal()">Voltar</button><button class="primary" onclick="confirmClassAndStart()">Começar aventura</button></div>`); chooseClass(selectedClass);
}
function applyClassStart(){
 const m=CLASS_INFO[s.classId||'neutral'].mods||{};
 s.maxHp=Math.max(30,Math.floor(s.maxHp*(1+(m.hp||0)/100))); s.hp=s.maxHp;
 s.maxEnergy=Math.max(20,Math.floor(s.maxEnergy*(1+(m.en||0)/100))); s.energy=s.maxEnergy;
 if((m.gather||0)>0)s.skills.gather=Math.max(s.skills.gather,Math.floor((m.gather||0)/20));
 if((m.agri||0)>0)s.skills.agri=Math.max(s.skills.agri,Math.floor((m.agri||0)/20));
 if((m.craft||0)>0)s.skills.craft=Math.max(s.skills.craft,Math.floor((m.craft||0)/25));
}
function giveStarterEquipment(){
 const starters=['leatherHelmet','leatherChest','explorerBoots2','leatherPants','ironSword','buckler'];
 for(const k of starters)s.inv[k]=(s.inv[k]||0)+1;
}
function confirmClassAndStart(){
 closeModal(); s.classId=selectedClass; applyDifficultyStart(); applyClassStart(); giveStarterEquipment(); localStorage.setItem(KEY,JSON.stringify(s)); startGame(); tutorial(); showTutorial();
}
function newGame(){s=defaults();s.name=(document.getElementById('nameInput').value.trim()||'Aventureiro').slice(0,20);s.mode=selectedMode;applyDifficultyStart();selectedClass='neutral';showClassChooser()}
function startCoopGame(m){ closeCoop(); if(typeof selectMode==='function')selectMode(m.difficulty||coopCfg.difficulty); document.getElementById('nameInput').value=coopName; s=defaults();s.name=coopName;s.mode=m.difficulty||coopCfg.difficulty;applyDifficultyStart();selectedClass='neutral';showClassChooser(); }
function classAttributeHTML(){const c=CLASS_INFO[s.classId||'neutral'];return `<div class="attr"><b>Classe</b><span>${c.icon} ${c.name}</span></div><div class="attr"><b>Força</b><span>${classBonus('str')>=0?'+':''}${classBonus('str')}</span></div><div class="attr"><b>Defesa</b><span>${classBonus('def')>=0?'+':''}${classBonus('def')+equipmentBonus('def')}</span></div><div class="attr"><b>Agilidade</b><span>${classBonus('agi')>=0?'+':''}${classBonus('agi')}</span></div><div class="attr"><b>Energia</b><span>${classBonus('en')>=0?'+':''}${classBonus('en')+equipmentBonus('en')}%</span></div>`}
function equipItem(k){const x=EQUIP[k];if(!x||!s.inv[k])return;const slot=x.slot;const old=s.equip[slot];if(old)s.inv[old]=(s.inv[old]||0)+1;s.inv[k]--;s.equip[slot]=k;if(slot==='weaponMain')s.equip.weapon=x.n;if(slot==='chest')s.equip.armor=x.n;setEvent(`🛡️ Equipaste ${x.n}.`,'good','Equipamento');render('inventory')}
function unequipItem(slot){const k=s.equip[slot];if(!k)return;s.inv[k]=(s.inv[k]||0)+1;s.equip[slot]=null;if(slot==='weaponMain')s.equip.weapon='Faca de viajante';if(slot==='chest')s.equip.armor='Roupa simples';setEvent('🎒 Equipamento removido.','good','Equipamento');render('inventory')}

;render(currentTab||'inventory');return}if(data.type==='event'){hostBroadcast({type:'event',name:conn.playerName||'Aventureiro',text:String(data.text||'').slice(0,180)});return}if(data.type==='leave')removeHostPlayer(conn.playerId,conn)});conn.on('close',()=>{if(conn.playerId)removeHostPlayer(conn.playerId,conn)});conn.on('error',()=>{if(conn.playerId)removeHostPlayer(conn.playerId,conn)})

<script>
/* =========================================================
   V14 — Coop resume, full gifting, farmer, regen, compact crafting/selling
   ========================================================= */
(function(){
  const V14_PLAYER_KEY='valedouro_coop_player_id';
  const V14_RECONNECT_MS=5*60*1000;
  function stableId(){
    let id=localStorage.getItem(V14_PLAYER_KEY);
    if(!id){id='p-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());localStorage.setItem(V14_PLAYER_KEY,id)}
    return id;
  }
  window.v14StableId=stableId;

  /* ---------- New pets ---------- */
  companions.push(
    {name:'Lontra',icon:'🦦',req:{skill:'fish',level:2},bonus:'+1 energia por pesca e +5% chance de captura',type:'fish',cost:55},
    {name:'Coruja',icon:'🦉',req:{skill:'fortune',level:3},bonus:'+8% Fortuna e +1 XP extra em eventos',type:'fortune',cost:60},
    {name:'Caracol',icon:'🐌',req:{skill:'agri',level:2},bonus:'+5% rendimento da quinta e +2 HP de regen',type:'agri',cost:55}
  );
  const oldPetBonus=petBonus;
  petBonus=function(name){
    const p=s.pets?.[name]; if(!p)return '';
    if(name==='Lontra')return `+${p.level}% captura e +${p.level} energia após pesca`;
    if(name==='Coruja')return `+${p.level*4}% Fortuna e +${p.level} XP em eventos`;
    if(name==='Caracol')return `+${p.level*3}% rendimento da quinta e +${p.level*2} HP/min`;
    return oldPetBonus(name);
  };
  const oldSetPet=setPet;
  setPet=function(name){
    if(!s.pets[name])s.pets[name]={level:1,xp:0};
    return oldSetPet(name);
  };

  /* ---------- Farmer class ---------- */
  Object.assign(CLASS_INFO,{farmer:{name:'Fazendeiro',icon:'🌾',desc:'Pouco dano e pouca Vida, mas muita Energia. As plantas têm 30% de chance de render o dobro.',mods:{str:-15,hp:-25,en:75,agri:30},weapons:'Ferramentas leves e armas simples.',doubleHarvest:.30}});

  /* ---------- Vitality + Vigor skills ---------- */
  Object.assign(SKILL_INFO,{
    vitality:{name:'Vitalidade',icon:'❤️',bonus:l=>l*8,effect:l=>`+${l*8} Vida máxima; +${l} HP/min`},
    vigor:{name:'Vigor',icon:'⚡',bonus:l=>l*10,effect:l=>`+${l*10} Energia máxima; +${l} energia/min`}
  });
  const oldSanitizeV14=sanitize;
  sanitize=function(x){
    const z=oldSanitizeV14(x);
    z.skills=Object.assign({vitality:0,vigor:0},z.skills||{});
    z.pets=z.pets||{};
    for(const p of companions)z.pets[p.name]=Object.assign({level:1,xp:0},z.pets[p.name]||{});
    z.regenRemainder=Object.assign({hp:0,energy:0},z.regenRemainder||{});
    z.classId=CLASS_INFO[z.classId]?z.classId:'neutral';
    return z;
  };

  function skillRegen(type){
    if(type==='hp')return Math.max(0,Number(s.skills?.vitality||0));
    return Math.max(0,Number(s.skills?.vigor||0));
  }
  function effectiveEquipmentStat(stat){
    let n=0;for(const slot of ['helmet','chest','boots','pants','weaponMain','weaponSecondary']){const k=s.equip?.[slot];if(k&&EQUIP[k])n+=Number(EQUIP[k][stat]||0)}return n;
  }
  function passiveTotals(){
    return {
      hpRegen:skillRegen('hp')+effectiveEquipmentStat('hpRegen'),
      energyRegen:skillRegen('energy')+effectiveEquipmentStat('energyRegen')
    };
  }
  window.v14PassiveTotals=passiveTotals;
  function applyPassiveRegen(min){
    if(!min||!s)return;
    const p=passiveTotals();
    if(!s.regenRemainder)s.regenRemainder={hp:0,energy:0};
    s.regenRemainder.hp+=p.hpRegen*min;
    s.regenRemainder.energy+=p.energyRegen*min;
    const dh=Math.floor(s.regenRemainder.hp),de=Math.floor(s.regenRemainder.energy);
    s.regenRemainder.hp-=dh;s.regenRemainder.energy-=de;
    if(dh>0)s.hp=Math.min(s.maxHp,s.hp+dh);
    if(de>0)s.energy=Math.min(s.maxEnergy,s.energy+de);
  }
  const oldAdvanceTimeV14=advanceTime;
  advanceTime=function(min,events=true){oldAdvanceTimeV14(min,events);applyPassiveRegen(Math.max(0,Math.floor(min)));};

  /* ---------- Max HP / Energy from skill + equipped item ---------- */
  function recalcEquippedVitals(){
    if(!s)return;
    if(!Number.isFinite(s.baseMaxHp))s.baseMaxHp=s.maxHp;
    if(!Number.isFinite(s.baseMaxEnergy))s.baseMaxEnergy=s.maxEnergy;
    const targetHp=Math.max(1,Math.floor(s.baseMaxHp + (s.skills?.vitality||0)*8 + effectiveEquipmentStat('hp')));
    const targetEnergy=Math.max(1,Math.floor(s.baseMaxEnergy + (s.skills?.vigor||0)*10 + effectiveEquipmentStat('en')));
    s.hp=Math.min(targetHp,Math.max(0,s.hp||0)+(targetHp-(s.maxHp||targetHp)>0?0:0));
    s.maxHp=targetHp;s.maxEnergy=targetEnergy;s.hp=Math.min(s.hp,s.maxHp);s.energy=Math.min(s.energy,s.maxEnergy);
  }
  const oldSkillV14=skill;
  skill=function(k){
    const before=Number(s.skills?.[k]||0);
    oldSkillV14(k);
    const after=Number(s.skills?.[k]||0);
    if(after>before&&(k==='vitality'||k==='vigor')){
      if(k==='vitality'){s.maxHp+=8;s.hp+=8}
      if(k==='vigor'){s.maxEnergy+=10;s.energy+=10}
      saveGame();render('skills');
    }
  };

  /* ---------- Equipment passive attributes ---------- */
  Object.assign(EQUIP,
    {ironHelmet:{hp:6,hpRegen:1},leatherHelmet:{hp:3,energyRegen:1},ironChest:{hp:15,hpRegen:1},leatherChest:{hp:6,energyRegen:1},ironBoots:{hp:3,energyRegen:1},explorerBoots2:{energyRegen:2},ironPants:{hp:7,hpRegen:1},leatherPants:{hp:4,energyRegen:1},ironSword:{energyRegen:1},crystalSword:{hpRegen:1},hunterBow:{energyRegen:2},battleAxe:{hp:10,energyRegen:-1},arcaneStaff:{en:12,energyRegen:2},ironDagger:{energyRegen:2},mace:{hpRegen:1},buckler:{hp:8},towerShield2:{hp:15,hpRegen:1},magicOrb:{en:8,energyRegen:2}}
  );
  const oldEquipItemV14=equipItem;
  equipItem=function(k){
    const x=EQUIP[k];if(!x)return oldEquipItemV14(k);
    const old=s.equip?.[x.slot], oldHp=old&&EQUIP[old]?Number(EQUIP[old].hp||0):0, oldEn=old&&EQUIP[old]?Number(EQUIP[old].en||0):0;
    const beforeHp=s.maxHp,beforeEn=s.maxEnergy;
    oldEquipItemV14(k);
    if(s.equip?.[x.slot]===k){s.maxHp+=Number(x.hp||0)-oldHp;s.maxEnergy+=Number(x.en||0)-oldEn;s.hp=Math.min(s.maxHp,s.hp+Math.max(0,Number(x.hp||0)-oldHp));s.energy=Math.min(s.maxEnergy,s.energy+Math.max(0,Number(x.en||0)-oldEn));saveGame();}
  };
  const oldUnequipItemV14=unequipItem;
  unequipItem=function(slot){
    const k=s.equip?.[slot],x=k&&EQUIP[k]?EQUIP[k]:null;
    oldUnequipItemV14(slot);
    if(x){s.maxHp=Math.max(1,s.maxHp-Number(x.hp||0));s.maxEnergy=Math.max(1,s.maxEnergy-Number(x.en||0));s.hp=Math.min(s.hp,s.maxHp);s.energy=Math.min(s.energy,s.maxEnergy);saveGame();}
  };

  /* ---------- Farmer harvest override ---------- */
  harvest=function(){
    const ready=s.farming.crops.filter(cropReady);
    if(!ready.length){setEvent('🌱 Ainda não há plantas prontas.','bad','Quinta');render('farm');return}
    s.farming.crops=s.farming.crops.filter(c=>!cropReady(c));let total=0;
    for(const c of ready){
      const p=PLANTS[c.type];let q=p.yield+Math.floor(skillLevel('agri')/2),mut='';
      if(Math.random()<p.mutate+skillLevel('agri')*.02){mut=['golden','giant','charged'][rand(0,2)];if(mut==='golden'){q++;s.inv.goldenCrop++}if(mut==='giant'){q*=3;s.inv.giantCrop++}if(mut==='charged'){s.inv.chargedCrop++;addEffect('speed','Velocidade','⚡',180)}}
      const farmer=String(s.classId||'neutral')==='farmer';
      if(farmer && Math.random()<.30)q*=2;
      s.inv[p.harvest]+=q;
      if(c.type==='seedSunroot'&&currentHour()<18)addEffect('sunheal','Cura Solar','☀️',180);
      if(c.type==='seedMoonberry'&&currentHour()>=18)addEffect('moonenergy','Energia Lunar','🌙',180);
      if(c.type==='seedEmberpepper')addEffect('fury','Fúria','🔥',1440);
      total+=q;log(`🌾 ${p.name}: +${q}${mut?` · MUTOU ${mut}`:''}${farmer?' · BÓNUS FAZENDEIRO':''}.`);
    }
    s.farming.harvested+=total;gainXP(8+total*3);setEvent(`🌾 Colheita: +${total} em ${ready.length} plantas.`,'good','Quinta');render('farm');saveGame();
  };

  /* ---------- Full gifting: every inventory item, including craftables ---------- */
  itemRow=function(k,v){
    const x=ITEM[k];if(!x||!v)return '';
    const use=['food','potion','bandage','mushroom','map','sunroot','moonberry','emberpepper','crystalflower','staminaTea','honeyTea','magicTonic','fishingNet','treasureCompass','smokeBomb','luckyCharm','repairKit','honey','berry'].includes(k);
    const eq=!!EQUIP[k];
    return `<div class="item"><div class="item-main"><div class="item-icon">${x.i}</div><div><div class="item-name">${x.n} <span class="badge">${v}</span></div><div class="item-desc">${x.d}</div></div></div><div class="item-actions">${eq?`<button onclick="equipItem('${k}')">Equipar</button>`:''}<button onclick="openGift('${k}')">🎁 Presentear</button>${use?`<button onclick="useItem('${k}')">Usar</button>`:''}</div></div>`;
  };

  /* Fix participant → host gifting direction. */
  const oldAttachHostV14=attachHostConnection;
  attachHostConnection=function(conn){
    coopConnections.push(conn);
    conn.on('data',data=>{
      if(!data||typeof data!=='object')return;
      if(data.type==='giftRequest'){
        const k=String(data.item||''),targetId=String(data.targetId||''),giverId=String(conn.playerId||'');
        if(!ITEM[k]||!s.inv[k]||!giverId||!targetId)return;
        const giver=coopPlayers.find(p=>p.id===giverId), target=coopPlayers.find(p=>p.id===targetId); if(!giver||!target||giverId===targetId)return;
        if(!giver.online)return;
        if(targetId===coopPlayerId){
          s.inv[k]=(s.inv[k]||0)+1;conn.send({type:'giftAccepted',item:k,qty:1,targetId:coopPlayerId});
          setEvent(`🎁 Recebeste 1× ${ITEM[k].n} de ${giver.name}.`,'good','Presente');saveGame();render('inventory');
          return;
        }
        const out=coopConnections.find(c=>c.playerId===targetId);
        if(!out?.open||target.online===false)return;
        s.inv[k]--;conn.send({type:'giftAccepted',item:k,qty:1});out.send({type:'gift',item:k,qty:1,from:giver.name});
        setEvent(`🎁 ${giver.name} enviou 1× ${ITEM[k].n} a ${target.name}.`,'good','Coop');return;
      }
      if(data.type==='gift'){
        const k=String(data.item||''); if(!ITEM[k]||!s.inv[k])return; const targetId=String(data.targetId||'');
        if(targetId){const out=coopConnections.find(c=>c.playerId===targetId);if(out?.open){s.inv[k]--;out.send({type:'gift',item:k,qty:1,from:coopName});}}
      }
    });
    /* Keep the old lobby/chat/event handling too. */
    oldAttachHostV14(conn);
  };

  /* ---------- Reconnection-safe party membership ---------- */
  let coopStartedV14=false;
  let coopRoomCreatedAt=0;
  function partySaveKey(){return `valedouro_coop_session_${coopRoom}_${stableId()}`}
  function saveCoopSession(){
    try{if(coopRoom&&document.getElementById('game')&&!document.getElementById('game').classList.contains('hidden'))localStorage.setItem(partySaveKey(),JSON.stringify(sanitize(s)))}catch(e){}
  }
  window.saveCoopSession=saveCoopSession;
  const oldSaveGameV14=saveGame;
  saveGame=function(){const r=oldSaveGameV14.apply(this,arguments);saveCoopSession();return r};

  const oldCreatePartyV14=createParty;
  createParty=function(){
    coopStartedV14=false;coopRoomCreatedAt=Date.now();
    const r=oldCreatePartyV14.apply(this,arguments);
    try{coopPlayerId=stableId();if(coopPlayers[0])coopPlayers[0].id=coopPlayerId;coopPlayers[0].online=true;coopPlayers[0].lastSeen=Date.now()}catch(e){}
    return r;
  };

  function sendHostState(){
    const state={type:'party',players:coopPlayers,maxPlayers:coopCfg.maxPlayers,difficulty:coopCfg.difficulty,private:coopCfg.private,hostId:coopPlayerId,started:coopStartedV14,chat:coopChatHistory.slice(-50)};
    coopConnections.slice().forEach(c=>{try{if(c.open)c.send(state)}catch(e){}});
  }
  function scheduleStale(id){setTimeout(()=>{const p=coopPlayers.find(x=>x.id===id);if(!p)return;if(p.online===false&&Date.now()-(p.lastSeen||0)>=V14_RECONNECT_MS){coopPlayers=coopPlayers.filter(x=>x.id!==id);sendHostState();renderPartyLobby('⏳ O jogador não reconectou a tempo e saiu da party.')}},V14_RECONNECT_MS+250)}

  const oldJoinPartyV14=joinParty;
  joinParty=function(){
    const result=oldJoinPartyV14.apply(this,arguments);
    const stable=stableId();
    const originalSend=coopConnections[0];
    if(originalSend){
      const originalOpen=originalSend.on;
      /* Patch the join packet when the connection opens. */
      originalSend.on('open',()=>{try{originalSend.send({type:'join',name:coopName,password:coopHostSecret,playerId:stable,online:true,resume:true})}catch(e){}});
      coopPlayerId=stable;
    }
    return result;
  };

  /* Replace the host connection handler completely so a reconnect reclaims the same slot. */
  const v14InstallHostHandler=()=>{
    attachHostConnection=function(conn){
      coopConnections.push(conn);
      conn.on('data',data=>{
        if(!data||typeof data!=='object')return;
        if(data.type==='join'){
          if(coopCfg.private&&String(data.password||'')!==String(coopHostSecret)){conn.send({type:'error',message:'Senha incorreta.'});conn.close();return}
          const id=String(data.playerId||'');
          if(!id){conn.send({type:'error',message:'Identificador inválido.'});conn.close();return}
          let p=coopPlayers.find(x=>x.id===id);
          if(p){
            p.name=String(data.name||p.name||'Aventureiro').slice(0,20);p.online=true;p.lastSeen=Date.now();
            conn.playerId=id;conn.playerName=p.name;
            coopConnections=coopConnections.filter(c=>c!==conn&&c.playerId!==id);coopConnections.push(conn);
            conn.send({type:'welcome',room:coopRoom,maxPlayers:coopCfg.maxPlayers,difficulty:coopCfg.difficulty,private:coopCfg.private,players:coopPlayers,chat:coopChatHistory,started:coopStartedV14,resume:true});
            sendHostState();renderPartyLobby('✅ Reconectado à mesma party.');return;
          }
          const active=coopPlayers.filter(x=>x.online!==false).length;
          if(active>=coopCfg.maxPlayers){conn.send({type:'error',message:'A party já está cheia.'});conn.close();return}
          p={id,name:String(data.name||'Aventureiro').slice(0,20),host:false,online:true,lastSeen:Date.now()};
          coopPlayers.push(p);conn.playerId=id;conn.playerName=p.name;
          conn.send({type:'welcome',room:coopRoom,maxPlayers:coopCfg.maxPlayers,difficulty:coopCfg.difficulty,private:coopCfg.private,players:coopPlayers,chat:coopChatHistory,started:coopStartedV14,resume:false});
          sendHostState();renderPartyLobby('✅ Um jogador entrou na party.');return;
        }
        if(!conn.playerId)return;
        const p=coopPlayers.find(x=>x.id===conn.playerId);if(p)p.lastSeen=Date.now();
        if(data.type==='chat'){
          const msg={type:'chat',name:conn.playerName||'Aventureiro',text:String(data.text||'').slice(0,180),photo:data.photo||null};
          coopChatHistory.push({name:msg.name,text:msg.text,photo:msg.photo});coopChatHistory=coopChatHistory.slice(-50);appendCoopChat(msg.name,msg.text,msg.photo);coopConnections.slice().forEach(c=>{try{if(c.open)c.send(msg)}catch(e){}});return;
        }
        if(data.type==='event'){hostBroadcast({type:'event',name:conn.playerName||'Aventureiro',text:String(data.text||'').slice(0,180)});return}
        if(data.type==='giftRequest'){
          const k=String(data.item||''),targetId=String(data.targetId||'');
          if(!ITEM[k]||!s.inv[k]||!targetId)return;
          const giver=coopPlayers.find(x=>x.id===conn.playerId),target=coopPlayers.find(x=>x.id===targetId);if(!giver||!target)return;
          if(targetId===coopPlayerId){s.inv[k]++;conn.send({type:'giftAccepted',item:k,qty:1});setEvent(`🎁 Recebeste 1× ${ITEM[k].n} de ${giver.name}.`,'good','Presente');saveGame();render('inventory');return}
          const out=coopConnections.find(c=>c.playerId===targetId&&c.open);if(!out||target.online===false)return;
          s.inv[k]--;conn.send({type:'giftAccepted',item:k,qty:1});out.send({type:'gift',item:k,qty:1,from:giver.name});return;
        }
        if(data.type==='leave'){const q=coopPlayers.find(x=>x.id===conn.playerId);if(q){q.online=false;q.lastSeen=Date.now();}sendHostState();renderPartyLobby('🔌 Um jogador desligou-se. Pode reconectar durante 5 minutos.');scheduleStale(conn.playerId);return}
      });
      const markOffline=()=>{const q=coopPlayers.find(x=>x.id===conn.playerId);if(q){q.online=false;q.lastSeen=Date.now();}coopConnections=coopConnections.filter(c=>c!==conn);sendHostState();if(conn.playerId)renderPartyLobby('🔌 Um jogador perdeu a ligação. Pode reconectar durante 5 minutos.');if(conn.playerId)scheduleStale(conn.playerId)};
      conn.on('close',markOffline);conn.on('error',markOffline);
    };
  };
  v14InstallHostHandler();

  /* Rework join to stable identity after the original has built its peer. */
  const v14JoinCurrent=joinParty;
  joinParty=function(){
    coopName=(document.getElementById('joinName').value.trim()||'Aventureiro').slice(0,20);
    const code=document.getElementById('joinCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6); if(code.length!==6)return alert('O código deve ter 6 caracteres.');
    const password=document.getElementById('joinPass').value||'';
    coopRoom=code;coopHost=false;coopHostSecret=password;coopChatHistory=[];
    if(typeof Peer==='undefined')return alert('A biblioteca de Coop não carregou. Verifica a internet.');
    coopResetPeer();coopStatus('A ligar à party…');
    coopPeer=new Peer();
    coopPeer.on('open',()=>{
      coopConnected=true;coopPlayerId=stableId();
      const conn=coopPeer.connect(coopPeerIdFromCode(code),{reliable:true,metadata:{name:coopName,stableId:coopPlayerId}});coopConnections=[conn];
      conn.on('open',()=>conn.send({type:'join',name:coopName,password,playerId:coopPlayerId,online:true,resume:true}));
      conn.on('data',handleJoinerMessage);
      conn.on('close',()=>{if(coopRoom)renderPartyLobby('🔌 Ligação perdida. Reabre o Coop e usa o mesmo código para reconectar.')});
      conn.on('error',()=>alert('A ligação à party falhou. Tenta novamente com o mesmo código.'));
    });
    coopPeer.on('error',err=>{console.warn('PeerJS',err);if(err&&err.type==='network')alert('Sem ligação ao serviço Coop.')});
  };

  /* ---------- Resume same local session instead of creating a new instance ---------- */
  function resumeCoopGame(m){
    closeCoop();selectMode(m.difficulty||coopCfg.difficulty);document.getElementById('nameInput').value=coopName;
    let loaded=false;
    try{const raw=localStorage.getItem(partySaveKey());if(raw){s=sanitize(JSON.parse(raw));loaded=true}}catch(e){loaded=false}
    if(loaded){coopStartedV14=true;startGame();setEvent(`👥 Reconectado à aventura Coop · ${coopRoom}.`,'good','Coop');render(s.currentTab||'explore');saveCoopSession();}
    else {s=defaults();s.name=coopName;s.mode=m.difficulty||coopCfg.difficulty;applyDifficultyStart();selectedClass='neutral';showClassChooser();}
  }
  const oldHandleJoinerV14=handleJoinerMessage;
  handleJoinerMessage=function(m){
    if(m.type==='welcome'||m.type==='party'){
      coopPlayers=m.players||[];coopCfg.maxPlayers=m.maxPlayers||coopCfg.maxPlayers;coopCfg.difficulty=m.difficulty||coopCfg.difficulty;coopCfg.private=!!m.private;
      if(Array.isArray(m.chat))coopChatHistory=m.chat.slice(-50);
      if(m.type==='welcome'&&m.started&&m.resume){resumeCoopGame(m);return}
      renderPartyLobby(m.type==='welcome'?'✅ Entraste na party.':'');return;
    }
    oldHandleJoinerV14(m);
  };
  const oldStartPartyV14=startParty;
  startParty=function(){
    if(!coopHost)return;
    coopStartedV14=true;
    const msg={type:'started',difficulty:coopCfg.difficulty,room:coopRoom,players:coopPlayers,started:true,resume:false};
    hostBroadcast(msg);startCoopGame(msg);
  };
  const oldStartCoopGameV14=startCoopGame;
  startCoopGame=function(m){
    if(m?.resume){resumeCoopGame(m);return}

  };

  /* When the class is finally confirmed, save a coop-specific checkpoint. */
  const oldConfirmClassV14=confirmClassAndStart;
  confirmClassAndStart=function(){const r=oldConfirmClassV14.apply(this,arguments);saveCoopSession();return r};

  /* ---------- Compact crafting: only crafts currently possible ---------- */
  function canCraftNow(k,r){return canReq(r.req)&&Object.entries(r.cost||{}).every(([a,b])=>(s.inv[a]||0)>=b)}
  function renderCompactCraft(){
    const c=document.getElementById('content');if(!c)return;
    const options=Object.entries(recipes).filter(([k,r])=>canCraftNow(k,r));
    const active=s.activeCraft?recipes[s.activeCraft.key]:null;
