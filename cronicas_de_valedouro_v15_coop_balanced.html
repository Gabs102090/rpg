  }

  const oldRenderV14=render;
  render=function(tab=currentTab){
    oldRenderV14(tab);
    if(tab==='craft'){renderCompactCraft();return}
    if(tab==='town'){
      const list=document.querySelector('.market-list');
      if(list){list.querySelectorAll('.market-row').forEach(row=>{const input=row.querySelector('input');if(!input||Number(input.max||0)<=0)row.remove()});if(!list.children.length)list.innerHTML='<p class="muted">Não tens itens vendáveis na bolsa.</p>'}
    }
    if(tab==='skills'){
      const panel=document.getElementById('content')?.querySelector('.panel');
      if(panel&&!panel.querySelector('.v14-passives')){
        const p=passiveTotals();const div=document.createElement('div');div.className='tip v14-passives';div.style.marginBottom='10px';div.innerHTML=`<b>❤️ Vitalidade:</b> ${s.skills?.vitality||0} · +${(s.skills?.vitality||0)*8} Vida máxima · +${p.hpRegen} HP/min<br><b>⚡ Vigor:</b> ${s.skills?.vigor||0} · +${(s.skills?.vigor||0)*10} Energia máxima · +${p.energyRegen} energia/min`;panel.insertBefore(div,panel.querySelector('.grid'));
      }
    }
  };

  /* ---------- Lobby shows disconnected players but keeps the slot ---------- */
  const baseLobbyV14=renderPartyLobby;
  renderPartyLobby=function(note=''){
    baseLobbyV14(note);
    const card=document.getElementById('coopCard');if(!card)return;
    card.querySelectorAll('.coop-player').forEach(el=>{const txt=el.textContent;const p=coopPlayers.find(x=>txt.includes(x.name));if(p&&p.online===false){el.querySelector('.coop-status').innerHTML='<span style="color:var(--muted)">🔌 Desligado · pode voltar</span>'}});
  };

  /* Ensure new pet keys appear in old saves immediately. */
  try{if(s){s.pets=s.pets||{};for(const p of companions)if(!s.pets[p.name])s.pets[p.name]={level:1,xp:0}}}catch(e){}
  window.v14ReconnectWindow=V14_RECONNECT_MS;
})();
</script>


<script>
/* =========================================================
   V15 — balance, cooldowns, shared coop, economy, scaling
   ========================================================= */
(function(){
  const V15={};
  V15.COOLDOWN_MS=2200;
  V15.coopShared=false;
  V15.coopInstanceId=null;
  const cooldowns=new Map();
  function now(){return Date.now()}
  function ensureState(){
    s.skills=s.skills||{}; s.skills.economy=Math.max(0,Math.floor(Number(s.skills.economy)||0));
    s.baseMaxHp=Number.isFinite(s.baseMaxHp)?s.baseMaxHp:s.maxHp||100;
    s.baseMaxEnergy=Number.isFinite(s.baseMaxEnergy)?s.baseMaxEnergy:s.maxEnergy||100;
    s.v15World=s.v15World||{};
  }
  function guardAction(key,ms=V15.COOLDOWN_MS){
    const t=cooldowns.get(key)||0, rem=t-now(); if(rem>0){
      setEvent(`⏳ Aguarda ${(rem/1000).toFixed(1)}s.`,'bad','Cooldown'); render(currentTab); return false;
    }
    cooldowns.set(key,now()+ms); return true;
  }
  function decorateCooldown(btn){
    if(!btn||btn.dataset.v15Cooldown)return;
    btn.dataset.v15Cooldown='1';
    const original=btn.textContent;
    btn.addEventListener('click',()=>{
      btn.disabled=true; let left=V15.COOLDOWN_MS/1000; const base=original;
      const iv=setInterval(()=>{left-=0.1;if(left<=0){clearInterval(iv);btn.disabled=false;btn.textContent=base}else btn.textContent=`⏳ ${left.toFixed(1)}s`},100);
    },{capture:false});
  }
  const oldRender=render;
  render=function(tab=currentTab){
    ensureState(); oldRender(tab);
    document.querySelectorAll('.actions button,.qolline button,.market-actions button').forEach(decorateCooldown);
  };

  /* ---- Reduce runaway percentage effects / action rewards ---- */
  Object.assign(SKILL_INFO,{
    combat:{name:'Combate',icon:'⚔️',bonus:l=>l*3,effect:l=>`+${l*3}% dano`},
    gather:{name:'Recolha',icon:'⛏️',bonus:l=>l*4,effect:l=>`+${l*4}% rendimento`},
    craft:{name:'Craft',icon:'🛠️',bonus:l=>l*5,effect:l=>`-${l*5}% tempo`},
    fish:{name:'Pesca',icon:'🎣',bonus:l=>l*3,effect:l=>`+${l*3}% captura`},
    fortune:{name:'Fortuna',icon:'🍀',bonus:l=>l*2,effect:l=>`+${l*2}% sorte`},
    agri:{name:'Agricultura',icon:'🌱',bonus:l=>l*4,effect:l=>`-${l*4}% crescimento; +${Math.min(15,l)}% mutações`},
    economy:{name:'Economia',icon:'🪙',bonus:l=>l*4,effect:l=>`+${l*4}% ouro ganho`},
    vitality:{name:'Vitalidade',icon:'❤️',bonus:l=>l*8,effect:l=>`+${l*8} Vida máxima; +${l} HP/min`},
    vigor:{name:'Vigor',icon:'⚡',bonus:l=>l*10,effect:l=>`+${l*10} Energia máxima; +${l} energia/min`}
  });
  const oldSkill=skill;
  skill=function(k){ if(!SKILL_INFO[k])return; const before=s.skills[k]||0; oldSkill(k); if((s.skills[k]||0)>before){ ensureState(); if(k==='vitality')s.maxHp+=8,s.hp=Math.min(s.maxHp,s.hp+8); if(k==='vigor')s.maxEnergy+=10,s.energy=Math.min(s.maxEnergy,s.energy+10); if(k==='economy')setEvent(`🪙 Economia ${s.skills.economy}: +${s.skills.economy*4}% ouro ganho.`,'good','Skill'); saveGame(); }};

  /* ---- Economy ---- */
  const oldGainXP=gainXP;
  gainXP=function(n){
    const v=Math.max(1,Math.floor(n)); oldGainXP(v);
  };
  function scaleGold(n){return Math.max(0,Math.floor(Number(n)*(1+(skillLevel('economy')*0.04))));}
  const oldSellAll=sellAll, oldBulkSell=bulkSell, oldSellAllMarket=sellAllMarket;
  sellAll=function(k,price){ if(!guardAction('sell:'+k))return; return oldSellAll(k,scaleGold(price)); };
  bulkSell=function(k,q,price){ if(!guardAction('sell:'+k))return; return oldBulkSell(k,q,scaleGold(price)); };
  sellAllMarket=function(){ if(!guardAction('sellAllMarket'))return; return oldSellAllMarket(); };

  /* ---- Cooldowns on exploration / farming actions ---- */
  const oldExplore=eventExplore, oldFish=fish, oldMine=mine, oldTreasure=treasure, oldTravel=travel, oldCombat=combat, oldCraft=craft, oldPlant=plant, oldHarvest=harvest;
  eventExplore=function(){if(!guardAction('explore'))return;return oldExplore();};
  fish=function(){if(!guardAction('fish'))return;return oldFish();};
  mine=function(){if(!guardAction('mine'))return;return oldMine();};
  treasure=function(){if(!guardAction('treasure'))return;return oldTreasure();};
  travel=function(i){if(!guardAction('travel'))return;return oldTravel(i);};
  combat=function(){if(!guardAction('combat'))return;return oldCombat();};
  craft=function(k){if(!guardAction('craft'))return;return oldCraft(k);};
  plant=function(k){if(!guardAction('plant'))return;return oldPlant(k);};
  harvest=function(){if(!guardAction('harvest'))return;return oldHarvest();};

  /* ---- Fish and mining: deliberately slower, bounded percentages ---- */
  const oldFishCore=fish;
  const oldCombatCoreV15=combat;
  fish=function(){
    if(!guardAction('fishcore'))return;
    if(!['Pântano de Veyra','Costa de Maré','Vale de Arven'].includes(s.zone)){setEvent('🎣 Não há água adequada aqui.','bad','Pesca');render();return}
    if(!spendEnergy(8))return; advanceForAction(45);
    let n=rand(1,2)+Math.floor(skillLevel('fish')/3);
    if(s.inv.bait){s.inv.bait--;n++;log('🪱 A isca deu +1 peixe.');}
    if(s.weather==='🌧️ Chuva' && Math.random()<0.25)n++;
    s.inv.fish+=n;s.stats.fish++;gainXP(scaleReward(8,'xp'));faction(s.zone==='Costa de Maré'?'Maré':'Arven');
    setEvent(`🎣 +${n} peixe.`,'good','Pesca');
    const rareChance=Math.min(.12,.06+skillLevel('fortune')*.01);
    if(Math.random()<rareChance){s.inv.treasure++;setEvent('🌊 Apanhaste uma pequena arca!','good','Pesca rara')}
    if(s.stats.fish>=15)achievement('angler','Pescador veterano');syncSharedState();render();
  };
  mine=function(){
    if(!guardAction('minecore'))return;
    if(!['Minas de Ferrugem','Pico de Arven'].includes(s.zone)){setEvent('⛏️ Aqui não há mineração boa.','bad','Mineração');render();return}
    if(!canReq({skill:'gather',level:2})||!spendEnergy(11))return; advanceForAction(60);s.stats.mine++;
    const n=rand(1,2)+Math.floor(skillLevel('gather')/3);s.inv.ore+=n;
    if(Math.random()<.28)s.inv.iron++;
    if(Math.random()<Math.min(.09,.03+skillLevel('fortune')*.01))s.inv.gems++;
    if(Math.random()<.08){if(s.inv.torch){s.inv.torch--;s.inv.crystal++;setEvent('🔥 A Tocha evitou um desabamento: +1 cristal.','good','Mineração')}else{s.hp=Math.max(1,s.hp-rand(7,14));setEvent('🪨 Desabamento!','bad','Mineração')}}
    gainXP(scaleReward(10,'xp'));setEvent(`⛏️ +${n} minério bruto.`,'good','Mineração');if(Math.random()<.18){ try{oldCombatCoreV15();}catch(e){} } syncSharedState();render();
  };

  /* ---- Enemies scale with player level + combat investment ---- */
  const enemyNames=['Lobo','Bandido','Slime','Aranha','Javali','Sentinela','Golem de Pedra','Caçador Sombrio','Aberração Arcana'];
  combat=function(){
    if(!guardAction('combatStart'))return;
    const c0=modeCfg(),power=s.level+skillLevel('combat')+Math.floor((classBonus('str')+equipmentBonus('def'))/30);
    const tier=Math.max(0,Math.floor((Math.max(1,s.level)-1)/2));
    const boss=s.level>=5&&Math.random()<Math.min(.22,.08+s.level*.008); const idx=Math.min(enemyNames.length-1,rand(tier,Math.min(enemyNames.length-1,tier+2)));
    const enemy=boss?'Guardião Antigo':enemyNames[idx];
    const baseHp=boss?90+18*s.level+8*power:26+8*s.level+6*tier+3*power;
    const dmgBase=boss?7+Math.floor(s.level*.8):3+Math.floor(s.level*.55)+tier;
    const ehp=Math.floor(baseHp*c0.enemyHp*(1+power*.045));
    combatState={ehp,maxEhp:ehp,boss,enemy,guard:false,cooldown:0,enemyPower:power,enemyDmgBase:dmgBase};renderCombat();
  };
  const oldEnemyTurn=enemyTurn;
  enemyTurn=function(){
    const c=combatState;if(!c)return;const raw=Math.floor((rand(c.enemyDmgBase,c.enemyDmgBase+Math.max(4,Math.floor(s.level*.7)))+(c.boss?5:0))*modeCfg().enemyDmg);let ed=c.guard?Math.ceil(raw*.35):raw;const hit=Math.max(1,ed-Math.floor(equipmentBonus('def')/6));s.hp-=hit;c.guard=false;c.cooldown=Math.max(0,(c.cooldown||0)-1);if(s.hp<=0){if(modeCfg().hardcore){localStorage.removeItem(KEY);alert('💀 Hardcore: morreste. Tens de começar um Novo Jogo.');location.reload();return}s.hp=s.maxHp;s.energy=s.maxEnergy;s.gold=Math.max(0,s.gold-10);s.zone='Vale de Arven';setEvent('☠️ Foste derrotado. Perdeste 10 ouro.','bad','Respawn');closeModal();render();}}

  /* ---- Shared Coop switch + persistent instance state ---- */
  ensureState();
  if(!companions.some(p=>p.name==='Gato'))companions.push({name:'Gato',icon:'🐈',req:{skill:'fortune',level:2},bonus:'+1.5% ouro e +1 energia/min',type:'fortune',cost:65});
  if(!companions.some(p=>p.name==='Falcão'))companions.push({name:'Falcão',icon:'🦅',req:{skill:'combat',level:4},bonus:'+2% dano e +2% chance de loot',type:'combat',cost:75});
  if(!companions.some(p=>p.name==='Tartaruga'))companions.push({name:'Tartaruga',icon:'🐢',req:{skill:'vitality',level:2},bonus:'+6 HP e +1 HP/min',type:'vitality',cost:70});
  coopCfg.shared=!!coopCfg.shared;
  function sharedSnapshot(){ensureState();return {inv:s.inv,gold:s.gold,xp:s.xp,level:s.level,xpNext:s.xpNext,skills:{...s.skills},farming:s.farming,day:s.day,gameMinutes:s.gameMinutes,zone:s.zone,weather:s.weather,time:s.time,events:s.events,stats:s.stats,reputation:s.reputation,activeCraft:s.activeCraft,pets:s.pets,petActive:s.petActive,instanceId:V15.coopInstanceId};}
  function applySharedSnapshot(m){if(!m||!m.inv)return;const own={name:s.name,classId:s.classId,equip:s.equip,hp:s.hp,maxHp:s.maxHp,energy:s.energy,maxEnergy:s.maxEnergy};s.inv=JSON.parse(JSON.stringify(m.inv));s.gold=Number(m.gold)||0;s.xp=Number(m.xp)||0;s.level=Math.max(1,Number(m.level)||1);s.xpNext=Number(m.xpNext)||100;s.skills=Object.assign({},s.skills||{},m.skills||{});s.farming=m.farming||s.farming;s.day=Number(m.day)||1;s.gameMinutes=Number(m.gameMinutes)||0;s.zone=m.zone||s.zone;s.weather=m.weather||s.weather;s.time=m.time||s.time;s.events=Array.isArray(m.events)?m.events.slice(0,8):s.events;s.stats=Object.assign({},s.stats||{},m.stats||{});s.reputation=Object.assign({},s.reputation||{},m.reputation||{});s.activeCraft=m.activeCraft||null;s.pets=m.pets||s.pets;s.petActive=m.petActive||s.petActive;s.name=own.name;s.classId=own.classId;s.equip=own.equip;s.hp=Math.min(own.maxHp,Math.max(0,own.hp));s.maxHp=own.maxHp;s.energy=Math.min(own.maxEnergy,Math.max(0,own.energy));s.maxEnergy=own.maxEnergy;V15.coopInstanceId=m.instanceId||V15.coopInstanceId;lastSharedHash=sharedHash(sharedSnapshot());saveCoopSession&&saveCoopSession();render(currentTab);}
  let lastSharedHash='';
  function sharedHash(st){try{return JSON.stringify(st)}catch(e){return ''}}
  function syncSharedState(){if(!coopRoom||!coopCfg.shared)return;const snap=sharedSnapshot(),hash=sharedHash(snap);if(hash===lastSharedHash)return;lastSharedHash=hash;const msg={type:'sharedState',state:snap,from:coopPlayerId};if(coopHost){hostBroadcast(msg)}else if(coopConnections[0]?.open){try{coopConnections[0].send({type:'sharedRequest',state:snap,from:coopPlayerId})}catch(e){}}}
  window.syncSharedState=syncSharedState;
  const oldSendHostState=sendHostState;
  sendHostState=function(){ensureState();if(!V15.coopInstanceId)V15.coopInstanceId=localStorage.getItem('valedouro_instance_'+coopRoom)||('inst-'+Math.random().toString(36).slice(2,10));localStorage.setItem('valedouro_instance_'+coopRoom,V15.coopInstanceId);const state={type:'party',players:coopPlayers,maxPlayers:coopCfg.maxPlayers,difficulty:coopCfg.difficulty,private:coopCfg.private,shared:!!coopCfg.shared,hostId:coopPlayerId,started:coopStartedV14,chat:coopChatHistory.slice(-50),instanceId:V15.coopInstanceId,world:sharedSnapshot()};coopConnections.slice().forEach(c=>{try{if(c.open)c.send(state)}catch(e){}})};

  /* Add shared mode to create-party UI. */
  const oldShowCreate=showCreateParty;
  showCreateParty=function(){oldShowCreate();const card=document.getElementById('coopCard');if(!card)return;const wrap=document.createElement('div');wrap.style.marginTop='9px';wrap.innerHTML=`<button type="button" class="coop-option" style="width:100%" id="sharedModeBtn">🤝 Coop partilhado <span id="sharedModeMark">${coopCfg.shared?'ON':'OFF'}</span></button><div class="muted" style="font-size:11px;margin-top:5px">Partilha inventário, loot, ouro, XP e mundo da aventura.</div>`;const actions=card.querySelector('.actions');card.insertBefore(wrap,actions);document.getElementById('sharedModeBtn').onclick=()=>{coopCfg.shared=!coopCfg.shared;document.getElementById('sharedModeMark').textContent=coopCfg.shared?'ON':'OFF';};}
  const oldCreate=window.createParty;
  window.createParty=function(){const r=oldCreate.apply(this,arguments);V15.coopInstanceId='inst-'+Math.random().toString(36).slice(2,10);localStorage.setItem('valedouro_instance_'+coopRoom,V15.coopInstanceId);sendHostState();return r;};
  const oldRenderLobby=renderPartyLobby;
  renderPartyLobby=function(note=''){oldRenderLobby(note);const card=document.getElementById('coopCard');if(!card)return;const p=document.createElement('div');p.className='tip';p.style.marginTop='8px';p.innerHTML=`${coopCfg.shared?'🤝 <b>Coop partilhado:</b> inventário, loot, ouro, XP e mundo partilhados.':'👤 <b>Coop individual:</b> cada jogador mantém o próprio progresso.'}<br><small>Instância: ${escapeHtml(V15.coopInstanceId||'a sincronizar')}</small>`;card.appendChild(p)};

  /* Host: robust reconnect + shared requests. */
  const oldAttach=attachHostConnection;
  attachHostConnection=function(conn){
    coopConnections.push(conn);
    conn.on('data',data=>{
      if(!data||typeof data!=='object')return;
      if(data.type==='join'){
        const id=String(data.playerId||''); if(!id)return;
        if(coopCfg.private&&String(data.password||'')!==String(coopHostSecret)){conn.send({type:'error',message:'Senha incorreta.'});conn.close();return}
        let p=coopPlayers.find(x=>x.id===id);
        if(p){p.online=true;p.lastSeen=Date.now();conn.playerId=id;conn.playerName=p.name;coopConnections=coopConnections.filter(c=>c!==conn&&c.playerId!==id);coopConnections.push(conn);conn.send({type:'welcome',room:coopRoom,maxPlayers:coopCfg.maxPlayers,difficulty:coopCfg.difficulty,private:coopCfg.private,shared:!!coopCfg.shared,players:coopPlayers,chat:coopChatHistory,started:coopStartedV14,resume:true,instanceId:V15.coopInstanceId,world:sharedSnapshot()});sendHostState();renderPartyLobby('✅ Reconectado à mesma instância.');return}
        if(coopPlayers.filter(x=>x.online!==false).length>=coopCfg.maxPlayers){conn.send({type:'error',message:'A party já está cheia.'});conn.close();return}
        p={id,name:String(data.name||'Aventureiro').slice(0,20),host:false,online:true,lastSeen:Date.now()};coopPlayers.push(p);conn.playerId=id;conn.playerName=p.name;
        conn.send({type:'welcome',room:coopRoom,maxPlayers:coopCfg.maxPlayers,difficulty:coopCfg.difficulty,private:coopCfg.private,shared:!!coopCfg.shared,players:coopPlayers,chat:coopChatHistory,started:coopStartedV14,resume:false,instanceId:V15.coopInstanceId,world:sharedSnapshot()});sendHostState();renderPartyLobby('✅ Um jogador entrou na party.');return;
      }
      if(!conn.playerId)return;
      const p=coopPlayers.find(x=>x.id===conn.playerId);if(p){p.lastSeen=Date.now();p.online=true}
      if(data.type==='sharedRequest'&&coopCfg.shared){applySharedSnapshot(data.state);hostBroadcast({type:'sharedState',state:sharedSnapshot(),from:coopPlayerId});return}
      if(data.type==='chat'){const msg={type:'chat',name:conn.playerName||'Aventureiro',text:String(data.text||'').slice(0,180),photo:data.photo||null};coopChatHistory.push({name:msg.name,text:msg.text,photo:msg.photo});coopChatHistory=coopChatHistory.slice(-50);appendCoopChat(msg.name,msg.text,msg.photo);hostBroadcast(msg);return}
      if(data.type==='giftRequest'){const k=String(data.item||''),targetId=String(data.targetId||'');if(!ITEM[k]||!targetId||!s.inv[k])return;const target=coopPlayers.find(x=>x.id===targetId);if(!target)return; if(targetId===coopPlayerId){s.inv[k]++;s.inv[k]=Math.max(0,s.inv[k]-1);conn.send({type:'giftAccepted',item:k,qty:1});return;}const out=coopConnections.find(c=>c.playerId===targetId&&c.open);if(!out)return;s.inv[k]--;out.send({type:'gift',item:k,qty:1,from:conn.playerName||'Aventureiro'});return;}
    });
    const offline=()=>{const p=coopPlayers.find(x=>x.id===conn.playerId);if(p){p.online=false;p.lastSeen=Date.now()}coopConnections=coopConnections.filter(c=>c!==conn);if(conn.playerId)renderPartyLobby('🔌 Ligação perdida. O mesmo jogador pode voltar à instância.');};
    conn.on('close',offline);conn.on('error',offline);
  };

  /* Joiner receives the instance/world snapshot before resuming. */
  const oldHandle=handleJoinerMessage;
  handleJoinerMessage=function(m){
    if(m.type==='welcome'||m.type==='party'){
      coopPlayers=m.players||[];coopCfg.maxPlayers=m.maxPlayers||coopCfg.maxPlayers;coopCfg.difficulty=m.difficulty||coopCfg.difficulty;coopCfg.private=!!m.private;coopCfg.shared=!!m.shared;V15.coopInstanceId=m.instanceId||V15.coopInstanceId;
      if(m.world)applySharedSnapshot(m.world); if(Array.isArray(m.chat))coopChatHistory=m.chat.slice(-50);
      if(m.type==='welcome'&&m.started&&m.resume){resumeCoopGame(m);return} renderPartyLobby(m.type==='welcome'?'✅ Estás na mesma instância.':'');return;
    }
    if(m.type==='sharedState'&&coopCfg.shared){applySharedSnapshot(m.state);return;}
    oldHandle(m);
  };

  /* Keep shared state moving without creating a flood. */
  setInterval(()=>{if(document.getElementById('game')&&!document.getElementById('game').classList.contains('hidden')&&coopRoom&&coopCfg.shared)syncSharedState()},1600);
  const oldPetBonusV15=petBonus; petBonus=function(name){const p=s.pets?.[name]; if(!p)return ''; if(name==='Gato')return `+${(p.level*1.5).toFixed(1)}% ouro e +${p.level} energia/min`; if(name==='Falcão')return `+${p.level*2}% dano e +${p.level*2}% chance de loot`; if(name==='Tartaruga')return `+${p.level*6} HP e +${p.level} HP/min`; return oldPetBonusV15(name)};
  window.v15Balance={cooldown:V15.COOLDOWN_MS,shared:()=>coopCfg.shared,instance:()=>V15.coopInstanceId};
  ensureState();
})();
</script>
